  --sar: env(safe-area-inset-right, 0px);
}
/* the night palette; .cx-opener keeps it in both themes (it sits on elements inside <html>, so its own values win over the .cx-day ones it would inherit) */
:root,
.cx-night,
.cx-opener {
  --cx-bg: #00002a;
  --cx-surface: #05053a;
  --cx-raised: #0a0a44;
  --cx-text: #eae4d4;
  --cx-strong: #f6dea2;
  --cx-muted: #b4ae9f;
  --cx-gold: #d8c06c;
  --cx-gold-text: #f0d89c;
  --cx-rule: rgba(216, 192, 108, 0.26);
  --cx-rule-strong: rgba(216, 192, 108, 0.62);
  --cx-sel: rgba(216, 192, 108, 0.13);
  --cx-btn-bg: #d8c06c;
  --cx-btn-fg: #00002a;
  --cx-fan: rgba(216, 192, 108, 0.15);
}
:root,
.cx-night {
  color-scheme: dark;
}
.cx-day {
  --cx-bg: #faf6ec;
  --cx-surface: #fffdf7;
  --cx-raised: #f2ebda;
  --cx-text: #1e1b16;
  --cx-strong: #00002a;
  --cx-muted: #5a5446;
  --cx-gold: #b49048;
  --cx-gold-text: #7a5a1e;
  --cx-rule: rgba(122, 90, 30, 0.22);
  --cx-rule-strong: rgba(122, 90, 30, 0.55);
  --cx-sel: rgba(180, 144, 72, 0.14);
  --cx-btn-bg: #00002a;
  --cx-btn-fg: #f6dea2;
  --cx-fan: rgba(180, 144, 72, 0.17);
  color-scheme: light;
}
/* navy in both themes: Home, Pick your spirits, chapter banners */
.cx-opener {
  background: var(--cx-bg);
  color: var(--cx-text);
}

*,
*::before,
*::after {
  box-sizing: border-box;
}
html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
body {
  margin: 0;
  background: var(--cx-bg);
  color: var(--cx-text);
  font-family: var(--cx-font-body);
  font-size: var(--cx-size-body);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}
button,
input {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
a {
  color: inherit;
  -webkit-tap-highlight-color: transparent;
}
:focus-visible {
  outline: 2px solid var(--cx-strong);
  outline-offset: 3px;
}
@media (prefers-reduced-motion: reduce) {
  * {
    transition: none !important;
    animation: none !important;
    scroll-behavior: auto !important;
  }
}
.vh {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* ---------- type ---------- */
.eyebrow {
  font: 600 12px/1.2 var(--cx-font-ui);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--cx-gold-text);
  margin: 0;
}
.label {
  font: 600 12px/1.25 var(--cx-font-ui);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--cx-gold-text);
  margin: 0;
}
.meta {
  font-style: italic;
  font-size: calc(15px * var(--cx-text-scale));
  line-height: 1.35;
  color: var(--cx-muted);
  margin: 0;
}
.display {
  font-family: var(--cx-font-display);
  font-weight: 400;
  color: var(--cx-strong);
  letter-spacing: 0.01em;
  line-height: 1;
  margin: 0;
}
.title {
  font-weight: 400;
  color: var(--cx-strong);
  line-height: 1.15;
  margin: 0;
}
.num {
  font-family: var(--cx-font-display);
  font-weight: 400;
  color: var(--cx-strong);
  line-height: 1;
}
.prose {
  font-size: var(--cx-size-body);
  line-height: 1.62;
  max-width: var(--cx-measure);
}
.prose p {
  margin: 0 0 1em;
}
.dropcap::first-letter {
  float: left;
  font-family: var(--cx-font-display);
  font-size: 4.2em;
  line-height: 0.8;
  padding: 0.06em 0.1em 0 0;
  color: var(--cx-gold-text);
}
.subhead {
  font-family: var(--cx-font-display);
  font-weight: 400;
  font-size: calc(32px * var(--cx-text-scale));
  line-height: 1.1;
  color: var(--cx-strong);
  margin: 1.4em 0 0.6em;
  scroll-margin-top: 80px;
}
.minorhead {
  font-family: var(--cx-font-display);
  font-weight: 400;
  font-size: calc(24px * var(--cx-text-scale));
  color: var(--cx-strong);
  margin: 1.2em 0 0.4em;
}
.amount {
  font-family: var(--cx-font-ui);
  font-variant-numeric: lining-nums tabular-nums;
  font-weight: 600;
  color: var(--cx-gold-text);
}

/* ---------- motifs ---------- */
.rule2 {
  height: 5px;
  border-top: 1px solid var(--cx-gold);
  border-bottom: 2.5px solid var(--cx-gold);
  opacity: 0.8;
}
.hair {
  height: 1px;
  background: var(--cx-rule);
}
.dia,
.dia-o {
  display: inline-block;
  width: 7px;
  height: 7px;
  flex: none;
  transform: rotate(45deg);
}
.dia {
  background: var(--cx-gold);
}
.dia-o {
  border: 1.3px solid var(--cx-gold);
  opacity: 0.75;
}
.divider {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin: 10px 0 22px;
}
.divider .h {
  width: 64px;
  height: 1px;
  background: var(--cx-gold);
  opacity: 0.8;
}
.niche {
  flex: none;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  border: 1px solid var(--cx-rule-strong);
  border-bottom-width: 2.5px;
  border-radius: 999px 999px 1px 1px;
  color: var(--cx-gold);
  padding-bottom: 6px;
}
.stepped {
  position: relative;
  background: var(--cx-raised);
  clip-path: polygon(
    0 14px,
    7px 14px,
    7px 7px,
    14px 7px,
    14px 0,
    calc(100% - 14px) 0,
    calc(100% - 14px) 7px,
    calc(100% - 7px) 7px,
    calc(100% - 7px) 14px,
    100% 14px,
    100% calc(100% - 14px),
    calc(100% - 7px) calc(100% - 14px),
    calc(100% - 7px) calc(100% - 7px),
    calc(100% - 14px) calc(100% - 7px),
    calc(100% - 14px) 100%,
    14px 100%,
    14px calc(100% - 7px),
    7px calc(100% - 7px),
    7px calc(100% - 14px),
    0 calc(100% - 14px)
  );
}
.stepped::before {
  content: '';
  position: absolute;
  inset: 5px;
  border: 1px solid var(--cx-rule-strong);
  pointer-events: none;
  clip-path: polygon(
    0 9px,
    2px 9px,
    2px 2px,
    9px 2px,
    9px 0,
    calc(100% - 9px) 0,
    calc(100% - 9px) 2px,
    calc(100% - 2px) 2px,
    calc(100% - 2px) 9px,
    100% 9px,
    100% calc(100% - 9px),
    calc(100% - 2px) calc(100% - 9px),
    calc(100% - 2px) calc(100% - 2px),
    calc(100% - 9px) calc(100% - 2px),
    calc(100% - 9px) 100%,
    9px 100%,
    9px calc(100% - 2px),
    2px calc(100% - 2px),
    2px calc(100% - 9px),
    0 calc(100% - 9px)
  );
}
.fan {
  position: absolute;
  pointer-events: none;
  stroke: var(--cx-fan);
  fill: none;
}

/* ---------- controls ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 44px;
  padding: 0 20px;
  border-radius: 1px;
  border: 1px solid var(--cx-rule-strong);
  background: transparent;
  color: var(--cx-gold-text);
  font: 600 12.5px/1 var(--cx-font-ui);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  text-decoration: none;
  white-space: nowrap;
}
.btn:active {
  background: var(--cx-sel);
}
.btn-primary {
  background: var(--cx-btn-bg);
  border-color: var(--cx-btn-bg);
  color: var(--cx-btn-fg);
}
.btn-primary:active {
  background: var(--cx-btn-bg);
  filter: brightness(1.12);
}
.btn-quiet {
  border-color: transparent;
  padding: 0 6px;
}
.btn:disabled {
  opacity: 0.4;
}
.iconbtn {
  width: 44px;
  height: 44px;
  padding: 0;
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 1px;
  border: 1px solid var(--cx-rule-strong);
  background: transparent;
  color: var(--cx-gold-text);
  text-decoration: none;
}
.link,
.tlink {
  color: var(--cx-gold-text);
  text-decoration: underline;
  text-decoration-color: var(--cx-rule-strong);
  text-underline-offset: 4px;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 40px;
  padding: 0 4px 0 14px;
  border: 1px solid var(--cx-gold);
  background: var(--cx-sel);
  color: var(--cx-strong);
  font-size: 16px;
  white-space: nowrap;
}
.chip button {
  width: 36px;
  height: 36px;
  border: 0;
  background: transparent;
  color: var(--cx-gold-text);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.tag {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 40px;
  padding: 0 14px;
  border: 1px solid var(--cx-rule);
  background: transparent;
  color: var(--cx-text);
  font-size: 16px;
  text-decoration: none;
  white-space: nowrap;
}
.tag[aria-pressed='true'] {
  border-color: var(--cx-gold);
  background: var(--cx-sel);
  color: var(--cx-strong);
}
.seg {
  display: inline-flex;
  border: 1px solid var(--cx-rule-strong);
}
.seg button,
.seg a {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 42px;
  min-width: 48px;
  padding: 0 14px;
  border: 0;
  background: transparent;
  color: var(--cx-gold-text);
  font: 600 12.5px/1 var(--cx-font-ui);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  text-decoration: none;
  white-space: nowrap;
}
.seg button[aria-pressed='true'],
.seg button[aria-selected='true'],
.seg a[aria-selected='true'] {
  background: var(--cx-btn-bg);
  color: var(--cx-btn-fg);
}
.stepper {
  display: inline-flex;
  align-items: center;
  border: 1px solid var(--cx-rule-strong);
}
.stepper button {
  width: 44px;
  height: 44px;
  border: 0;
  background: transparent;
  color: var(--cx-gold-text);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.stepper button:disabled {
  opacity: 0.35;
}
.stepper output {
  min-width: 84px;
  text-align: center;
  font-size: 17px;
  color: var(--cx-strong);
}
/* the tick: a small diamond */
.box {
  width: 15px;
  height: 15px;
  border: 1.3px solid var(--cx-rule-strong);
  border-radius: 1px;
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: transparent;
  transform: rotate(45deg);
}
.box svg {
  transform: rotate(-45deg);
  width: 9px;
  height: 9px;
}
[aria-pressed='true'] > .box,
.box.on {
  background: var(--cx-gold);
  border-color: var(--cx-gold);
  color: var(--cx-bg);
}
.note {
  font-size: 15px;
  line-height: 1.45;
  border: 1px solid var(--cx-rule);
  padding: 10px 14px;
  background: var(--cx-sel);
  margin: 0;
}
.scaled {
  font-style: italic;
  font-size: 15px;
  color: var(--cx-gold-text);
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
  margin: 0;
}
.asis {
  display: inline-block;
  width: 7px;
  height: 7px;
  border: 1.25px solid var(--cx-gold);
  transform: rotate(45deg);
  margin: 0 0 2px 8px;
  vertical-align: middle;
}
.search {
  position: relative;
  display: block;
}
.search svg {
  position: absolute;
  left: 6px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--cx-muted);
  pointer-events: none;
}
.search input {
  width: 100%;
  min-height: 44px;
  border: 0;
  border-bottom: 1px solid var(--cx-rule-strong);
  border-radius: 0;
  background: transparent;
  color: var(--cx-text);
  padding: 0 10px 0 32px;
  font-size: 17px;
  font-style: italic;
  -webkit-appearance: none;
  appearance: none;
}
.search input:focus {
  border-bottom-color: var(--cx-gold);
  outline: none;
  font-style: normal;
}
.search input::placeholder {
  color: var(--cx-muted);
  opacity: 1;
}

/* ---------- shell ---------- */
.screen {
  min-height: 100vh;
  min-height: 100dvh;
  padding-left: var(--sal);
  padding-right: var(--sar);
}
.wrap {
  max-width: 1280px;
  margin: 0 auto;
}
.tabbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 20;
  display: flex;
  justify-content: space-around;
  padding: 8px 10px calc(8px + var(--sab));
  border-top: 1px solid var(--cx-rule);
  background: var(--cx-bg);
}
.tab {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-width: 70px;
  min-height: 46px;
  font: 600 10.5px/1 var(--cx-font-ui);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--cx-muted);
  text-decoration: none;
  background: none;
  border: 0;
}
.tab .dia-o {
  opacity: 0.6;
}
.tab[aria-current='page'] {
  color: var(--cx-gold-text);
}
.has-tabbar {
  padding-bottom: calc(84px + var(--sab));
}
.bar-top {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: calc(8px + var(--sat)) 12px 8px;
  background: var(--cx-bg);
  border-bottom: 1px solid var(--cx-rule);
}
.back {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  font: 600 12px/1 var(--cx-font-ui);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--cx-gold-text);
  text-decoration: none;
}

/* ---------- library ---------- */
.lib-head {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: calc(16px + var(--sat)) 28px 12px;
  flex-wrap: wrap;
}
.wordmark {
  font-size: 38px;
  text-decoration: none;
}
.lib-tools {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1 1 300px;
  justify-content: flex-end;
}
.lib-tools .search {
  flex: 1;
  max-width: 460px;
  margin-right: auto;
  margin-left: 12px;
}
.lib-body {
  display: flex;
  align-items: flex-start;
}
.filters {
  width: 240px;
  flex: none;
  border-right: 1px solid var(--cx-rule);
  padding: 16px 20px 30px 28px;
  position: sticky;
  top: 0;
  max-height: 100vh;
  overflow: auto;
}
.facet {
  margin-bottom: 14px;
}
.facet-h {
  display: flex;
  width: 100%;
  align-items: center;
  justify-content: space-between;
  min-height: 40px;
  border: 0;
  background: transparent;
  padding: 0;
  color: var(--cx-gold-text);
  font: 600 12px/1 var(--cx-font-ui);
  letter-spacing: 0.2em;
  text-transform: uppercase;
}
.check {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 38px;
  font-size: calc(16.5px * var(--cx-text-scale));
  color: var(--cx-text);
}
.check[aria-pressed='true'] {
  color: var(--cx-strong);
}
.count {
  margin-left: auto;
  font-style: italic;
  font-size: 14px;
  color: var(--cx-muted);
}
.results {
  flex: 1;
  min-width: 0;
  padding: 16px 28px 40px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.lib-title {
  display: flex;
  align-items: baseline;
  gap: 16px;
  flex-wrap: wrap;
}
.lib-title h1 {
  font-size: 42px;
}
.chips {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 14px 18px;
}
.card {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 12px 16px;
  border: 1px solid var(--cx-rule);
  background: var(--cx-surface);
  text-decoration: none;
  min-height: 108px;
  transition:
    border-color 0.15s ease,
    background-color 0.15s ease;
}
.card:hover,
.card:active {
  border-color: var(--cx-rule-strong);
  background: var(--cx-sel);
}
.card .niche {
  width: 54px;
  height: 72px;
}
.card-photo img {
  width: 72px;
  height: 96px;
  object-fit: cover;
  display: block;
}
.card-body {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
  flex: 1;
}
.card-title {
  font-size: calc(21px * var(--cx-text-scale));
  line-height: 1.15;
  color: var(--cx-strong);
  margin: 0;
}
.card-ings {
  font-size: calc(15px * var(--cx-text-scale));
  line-height: 1.35;
  color: var(--cx-text);
}
.card-hint {
  font-size: calc(15px * var(--cx-text-scale));
  line-height: 1.35;
  color: var(--cx-text);
}
.card mark,
.card-hint mark {
  background: transparent;
  color: var(--cx-strong);
  border-bottom: 1.5px solid var(--cx-gold);
  padding: 0;
}
.essay-entry {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 14px 18px;
  text-decoration: none;
}
.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 36px 16px;
  text-align: center;
  border: 1px dashed var(--cx-rule);
}
.empty .display {
  font-size: 26px;
}
.filter-sheet .filters {
  width: auto;
  border: 0;
  position: static;
  max-height: none;
  padding: 0;
}

/* ---------- write-ups ---------- */
.essay {
  display: flex;
  align-items: flex-start;
}
.toc {
  width: 250px;
  flex: none;
  padding: 24px 22px 40px 32px;
  border-right: 1px solid var(--cx-rule);
  position: sticky;
  top: 0;
  max-height: 100vh;
  overflow: auto;
}
.toc a {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 40px;
  text-decoration: none;
  color: var(--cx-muted);
  font-size: 17px;
  line-height: 1.2;
}
.toc a .mark {
  width: 7px;
  height: 7px;
  flex: none;
  transform: rotate(45deg);
  border: 1.3px solid var(--cx-gold);
  opacity: 0.45;
}
.toc a.cur {
  color: var(--cx-strong);
}
.toc a.cur .mark {
  background: var(--cx-gold);
  opacity: 1;
}
.toc .tlink {
  display: inline;
  min-height: 0;
  color: var(--cx-gold-text);
}
.toc .side-sec {
  margin-top: 22px;
  padding-top: 14px;
  border-top: 1px solid var(--cx-rule);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.essay article {
  flex: 1;
  min-width: 0;
  padding: 30px 56px 80px;
}
.essay article > div {
  max-width: var(--cx-measure);
}
.essay h2.etitle {
  font-family: var(--cx-font-display);
  font-weight: 400;
  font-size: clamp(34px, 4.4vw, 46px);
  line-height: 1.05;
  color: var(--cx-strong);
  margin: 0;
}

/* ---------- chapter banner ---------- */
.ch-banner {
  position: relative;
  overflow: hidden;
  padding: calc(14px + var(--sat)) calc(28px + var(--sar)) 18px calc(28px + var(--sal));
  min-height: 220px;
  display: flex;
  flex-direction: column;
}
.ch-banner .art {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  stroke: var(--cx-fan);
  stroke-width: 1.3;
  fill: none;
  pointer-events: none;
}
.ch-banner-top {
  position: relative;
  display: flex;
  align-items: center;
  gap: 8px;
}
.ch-banner-top .btn,
.ch-banner-top .iconbtn {
  background: var(--cx-bg);
}
.ch-banner-row {
  position: relative;
  margin-top: auto;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}
.ch-banner-words {
  margin-left: auto;
  text-align: right;
  display: flex;

/* ---------- the bar table ---------- */

.bt th,

  border-bottom: 1px solid var(--cx-rule);

}
.bt thead th {
  font-style: italic;
  font-weight: 400;
  font-size: 14px;
  line-height: 1.2;
  color: var(--cx-muted);
  border-bottom: 2.5px solid var(--cx-gold);
  vertical-align: bottom;
}
.bt tbody th {
  font-family: var(--cx-font-display);
  font-weight: 400;
  font-size: 21px;

.bt td {

.bt td a {

}
.bt td span.nr {

}

.bt-row-tabs {

/* ---------- sheet ---------- */
.scrim {
  position: fixed;
  inset: 0;
  z-index: 40;
  background: rgba(0, 0, 12, 0.6);
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.sheet {
  width: min(560px, 100%);
  max-height: 88vh;
  overflow: auto;
  background: var(--cx-raised);
  color: var(--cx-text);
  border-top: 2.5px solid var(--cx-gold);
  padding: 16px 22px calc(22px + var(--sab));

  width: 40px;
  height: 4px;

  background: var(--cx-rule-strong);
}

.sheet h2 {

  font-weight: 400;
  font-size: 30px;

}
.sheet .row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 0;

}
.sheet .seg button {
  text-transform: none;

}
#update {
  position: fixed;
  left: 0;
  right: 0;
  top: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: calc(12px + var(--sat)) 18px 12px;
  background: var(--cx-raised);

  color: var(--cx-strong);
}

  flex: 1;
}

}
.home-top {

.home-head {

}

}
.spirit {
  position: relative;

  height: 236px;
  display: flex;
  flex-direction: column;
  align-items: center;

    background-color 0.2s ease,
    border-color 0.2s ease,

.spirit .top {
  position: absolute;
  top: 18px;
  left: 50%;
  margin-left: -3px;
}
.spirit .sg {
  display: flex;
}
.spirit .sn {
  font-size: 34px;
  line-height: 1;

}
.spirit .sc {
  font-style: italic;

}
.spirit:hover,
.spirit:focus-visible,
.spirit:active {
  background: rgba(216, 192, 108, 0.12);
  border-color: var(--cx-gold);

  outline: none;
}
.spirit:hover .sn,
.spirit:focus-visible .sn {

}
.spirit:hover .top,

.home-bar {

    linear-gradient(45deg, transparent 50%, var(--cx-gold) 50%),
    linear-gradient(135deg, var(--cx-gold) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 52%,
    calc(100% - 9px) 52%;
  background-size: 5px 5px;
  background-repeat: no-repeat;
  padding-right: 28px;
}
.field select option {
  background: var(--cx-raised);
  color: var(--cx-text);
}
.field input:focus,
.field select:focus,
.field textarea:focus {
  outline: none;
  border-color: var(--cx-gold);
}
.field input::placeholder,
.field textarea::placeholder {
  color: var(--cx-muted);
  opacity: 0.8;
  font-style: italic;
}
.hint {
  font-style: italic;
  font-size: 14.5px;
  line-height: 1.4;
  color: var(--cx-muted);
}
.field-row {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 0 20px;
}
.field-cols {
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  gap: 0 26px;
  align-items: start;
}
#ed-preview .ing {
  font-size: 16px;
}
.ed-acts {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 28px;
  padding-top: 18px;
  border-top: 1px solid var(--cx-rule);
}
.mine-tag {
  display: inline-block;
  margin-left: 10px;
  padding: 2px 7px 1px;
  border: 1px solid var(--cx-rule-strong);
  font: 600 10px/1.4 var(--cx-font-ui);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--cx-gold-text);
  vertical-align: 3px;
}
.mine-acts {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 14px;
}
.mine-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 12px 16px;
  border: 1px solid var(--cx-rule);
  background: var(--cx-sel);
}
.home-links {
  position: relative;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 6px 12px;
  margin: 10px 0 0;
  font-size: 16px;
  color: var(--cx-muted);
}
#toast {
  position: fixed;
  left: 50%;
  bottom: calc(96px + var(--sab));
  z-index: 60;
  transform: translate(-50%, 20px);
  opacity: 0;
  pointer-events: none;
  max-width: min(520px, calc(100% - 32px));
  padding: 12px 18px;
  background: var(--cx-raised);
  color: var(--cx-strong);
  border: 1px solid var(--cx-gold);
  font-style: italic;
  font-size: 16px;
  line-height: 1.35;
  text-align: center;
  transition:
    opacity 0.2s ease,
    transform 0.2s ease;
}
#toast.on {
  opacity: 1;
  transform: translate(-50%, 0);
}
@media (min-width: 900px) {
  #toast {
    bottom: 28px;
  }
}
@media (max-width: 899px) {
  .editor {
    padding: 14px 18px calc(110px + var(--sab));
  }
  .field-row {
    grid-template-columns: 1fr 1fr;
  }
  .field-row .field:first-child {
    grid-column: 1 / -1;
  }
  .field-cols {
    grid-template-columns: 1fr;
  }
  .lib-title .btn {
    padding: 0 12px;
  }
}
.add-card {
  border-style: dashed;
  background: transparent;
}
.add-card .niche {
  color: var(--cx-gold-text);
}
.add-card .card-title {
  color: var(--cx-gold-text);
}
.add-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  font-size: 17px;
  color: var(--cx-gold-text);
  text-decoration: underline;
  text-decoration-color: var(--cx-rule-strong);
  text-underline-offset: 4px;
}
.plan-pick .add-link {
  font-size: 16px;
}
.bar-add {
  display: flex;
  align-items: center;
  gap: 6px 16px;
  flex-wrap: wrap;
  margin-top: 26px;
  padding-top: 14px;
  border-top: 1px solid var(--cx-rule);
}
.pick-add {
  padding: 4px 0 6px;
  border-bottom: 1px solid var(--cx-rule);
  margin-bottom: 4px;
}
.pick-add .add-link {
  min-height: 40px;
}
@media (max-width: 1150px) {
  .plan-desc {
    display: none;
  }
}
.exp-opt {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 6px;
  width: 100%;
  padding: 16px 18px;
  border: 1px solid var(--cx-rule-strong);
  background: var(--cx-surface);
  color: inherit;
  text-align: left;
}
.exp-opt:active {
  background: var(--cx-sel);
}
.exp-opt:disabled {
  opacity: 0.45;
}
.vlist .mine-tag,
.display .mine-tag {
  vertical-align: middle;
}

/* ---------- the iPhone recipe introduction follows Text size (its size is set inline, hence !important) ---------- */
@media (max-width: 899px) {
  .recipe main > div > .prose {
    font-size: calc(17px * var(--cx-text-scale)) !important;
  }
}

/* ---------- sunbursts start from the foot of their heading, clear of what follows ---------- */
.home-head,
.pick-head {
  position: relative;
  z-index: 0;
}
.home-head .fan,
.pick-head .fan {
  left: 50%;
  top: auto;
  bottom: 0;
  width: 100vw;
  height: 420px;
  transform: translateX(-50%);
  z-index: -1;
}
.pick-head .fan {
  height: 260px;
}
.pick {
  overflow-x: clip;
}
.pick-sub {
  display: table;
  margin: 8px auto 0;
  padding: 0 12px;
  background: var(--cx-bg);
  font-size: calc(17px * var(--cx-text-scale));
  color: var(--cx-text);
}
@media (max-width: 899px) {
  .home-head .fan {
    height: 300px;
  }
}

/* ---------- What I have: every bottle sits at the same height, whether its name takes one line or two ---------- */
.arch-b {
  justify-content: flex-start;
  padding-top: 50px;
}
@media (max-width: 899px) {
  .arch-b {
    width: 100%;
    max-width: 106px;
    justify-self: center;
    height: 110px;
    padding-top: 30px;
  }
}
@media (min-width: 640px) and (max-width: 899px) {
  .arches {
    grid-template-columns: repeat(8, minmax(0, 1fr));
  }
}

/* ---------- chapter banners: the line art stays behind the chapter name, not the small type ---------- */
.ch-banner-top .back {
  margin-left: -6px;
  padding: 0 10px 0 6px;
  background: var(--cx-bg);
}
.ch-banner-words .eyebrow {
  padding: 3px 0 3px 10px;
  background: var(--cx-bg);
}
.ch-tabs a {
  padding: 0 10px;
  background: var(--cx-bg);
}
@media (max-width: 899px) {
  .ch-tabs {
    margin: 0 -16px -12px;
    padding: 6px 16px 12px;
    background: var(--cx-bg);
  }
  .ch-tabs a {
    padding: 0;
    background: none;
  }
}

/* ---------- mixing mode: one amount column, as wide as the longest amount ("1 teaspoon") ---------- */
.mix-ing .amount {
  width: auto;
  min-width: 3.4em;
  white-space: nowrap;
}
@supports (grid-template-columns: subgrid) {
  .mix-ings {
    display: grid;
    grid-template-columns: auto max-content minmax(0, 1fr);
    column-gap: 16px;
    align-content: start;
  }
  .mix-ing {
    display: grid;
    grid-column: 1 / -1;
    grid-template-columns: subgrid;
  }
  .mix-ing .amount {
    min-width: 0;
  }
  .mix-ing .nm {
    overflow-wrap: anywhere;
  }
}

/* ---------- iPhone recipe: room for the taller bottom bar when a recipe is scaled ---------- */
@media (max-width: 899px) {
  .recipe main {
    padding-bottom: calc(190px + var(--sab));
  }
}

/* ---------- the fixed bars keep their size, so they never grow over the page beneath ---------- */
.bottombar .meta,
.plan-strip .meta {
  font-size: 15px;
}

/* ---------- a toast with an action (Undo) ---------- */
#toast.has-act.on {
  pointer-events: auto;
}
.toast-act {
  margin-left: 14px;
  min-height: 32px;
  padding: 0 4px;
  border: 0;
  background: none;
  color: var(--cx-gold-text);
  font: 600 12px/1 var(--cx-font-ui);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  text-decoration: underline;
  text-underline-offset: 4px;
}

<script type="application/json" id="cx-data">{"built":"11 November 2026, 23:47","chapters":[{"id":"whiskey","name":"Whiskey","display":"whiskey","label":"Chapter one","essay":{"title":"Whiskey - an overview","blocks":[{"t":"p","text":"Whiskey is made all over the world and goes by different names: bourbon, rye, scotch, Irish whiskey, Canadian whisky, Japanese whiskey. But the important thing to remember is these are all different types of whiskey. Whiskey is the genus and these sub-categories are the species."},{"t":"p","text":"For cocktails, the default whiskey style is American whiskey, which predominantly means bourbon or rye. This is because most modern cocktails were more or less invented in America, thus classics like the Manhattan and Whiskey-Sour were all created using America's whiskey."},{"t":"p","text":"Bourbon is somewhat rounder and mellower, while rye is sharper and spicier. Both are excellent options, Rye works well in classics like the Manhattan and Old Fashioned, but it’s generally up to personal preference."},{"t":"h2","text":"American Whiskey"},{"t":"p","text":"American Whiskey refers to all whiskey made in the United States. It is the go-to whiskey for cocktails. Bourbon is by far the most prominent and widely distributed style. Behind it is rye, which has made a notable comeback in recent years, though it still trails bourbon sales by a wide margin. Broadly speaking, bourbon is mellower and rounder while rye is sharper, spicier and drier."},{"t":"p","text":"Bourbon and rye are the heart of the American whiskey category and the base of whiskey cocktails everywhere. Tennesee whiskey is sort of a sub-category of bourbon, it's made in exactly the same way, just with a few added variables."},{"t":"p","text":"Any time a recipe calls broadly for \"whiskey\" either bourbon or rye will serve well in its own particular way. Rye tends to work better in stirred, spirit-forward cocktails like Manhattans and Old Fashioneds because its spicier flavours punch through a little more. For shaken and/or refreshing cocktails like a Whiskey Sour or Mint Julep, the more even-keeled bourbon works well. But a bourbon Manhattan or a rye Mint Julep will have different special flavour as well. The choice is yours, and there isn't a wrong one."},{"t":"h2","text":"Scotch Whisky"},{"t":"p","text":"While American whiskey may be the go-to whiskey for cocktails, if you order a whiskey just about anywhere outside of North America, you'll get a scotch (and the whisky won't be spelled with an \"e\")."},{"t":"p","text":"Scotch whisky can only be made in Scotland. Its primary flavouring grain is barley, though wheat and corn play important roles as well. Scotch is commonly known for having a smoky, campfire-like flavour. This comes from burning peat, to dry the barley. This why you sometimes hear scotch described as “peaty”. But not every scotch tastes smoky. In fact, most don’t. Some are very subtle with notes of honey, flowers, and dried fruit. And those that are smoky, vary greatly in intensity."},{"t":"p","text":"There are two main types of Scotch: single malt scotch and blended scotch, though there are others. Single malts are made from 100% malted barley and all the whiskey must comes from one distillery. They are generally more intense tasting, aged for longer, and more expensive. Blended scotches are a blend of 15-40% single malt scotch and 60-85% grain whiskey (technically called single grain scotch) which is typically made mostly from wheat and much lighter and cheaper to produce. Thus, blended scotch tends to have a milder flavour profile that’s easier to drink and is less expensive, making them great for mixing into cocktails."},{"t":"quote","text":"But when you get it right, Scotch cocktails don't just succeed, they thrive."},{"t":"p","text":"Given these definitions, it’s tempting to view single malts as superior, purer expressions of scotch and blends as second-tier, budget options only fit for mixing, but that’s a misguided assumption. They are apples and oranges. Single malt scotch represents the singular expression of a distillery. It’s meant to be more pointed and fuller flavoured. A blend tries to bring multiple scotches and flavours into balance. That’s why it can work better for mixing; it plays well with others."},{"t":"p","text":"Scotch is a challenging spirit to mix with. It can easily clash with or downright dominate other ingredients. But when you get it right, Scotch cocktails don't just succeed, they thrive. As is usually the case, it's best to start with the classics. Favourites are the Rob Roy (a scotch Manhattan), the Bobby Burns (a Rob Roy with a little Benedictine) and Sammy Ross’ gingery modern classic, the Penicillin."},{"t":"h2","text":"Irish Whiskey"},{"t":"p","text":"Irish whiskey is generally lighter, milder, and altogether easier to drink than scotch or American whiskey. This is why a shot of Jameson is the way many newcomers are introduced to the whiskey at large."},{"t":"p","text":"While Irish whiskey is a cornerstone whiskey category in many circles, it is not usually the first choice for cocktails. For one, outside of the Irish Coffee, there aren’t many classics that call it (The Emerald is another, which is an Irish whiskey Manhattan with orange bitters)."},{"t":"p","text":"Secondly, Irish whiskey's mellowness - which is what many find appealing about it on its own - comes off a little soft in cocktails. Especially when compared to American whiskey which typically has a sharp spice note. So I prefer it served neat or maybe with some ice. But as always it is a matter of personal preference."},{"t":"h2","text":"Canadian Whiskey"},{"t":"p","text":"Stylistically, Canadian whisky is closest to American whiskey in that they both use corn as their primary grain. In general, Canadian whiskies lean towards lighter, slightly sweeter flavours like soft oak, fruit, and maple. There is some spice, but less bite compared to American whiskey. There are two key contributing factors to this. One, Canadian whisky is typically distilled to higher proofs, and two, they are often aged in used oak barrels, as opposed to brand new ones, as is the case with American bourbons and ryes. Mind you, this does not make them inferior, it is merely indicative of their style."},{"t":"p","text":"Canada and the United States have different definitions of rye whiskey, and they are made in completely different ways."},{"t":"p","text":"American rye whiskey needs to have at least 51% rye in the mash. Canadian whisky is all about blends rather a single mashbill, so that doesn’t apply. In Canada, rye is added through the flavouring whisky, but there’s no directive saying how much flavouring whisky must be used in a blend, or how much rye it must contain, if any. Despite their association, many Canadian whiskys contain no rye or very little."},{"t":"p","text":"This brings us to the most confusing part. In Canada today, the terms Canadian whisky, Canadian Rye whisky, and Rye whisky and are all legally interchangeable. Which means, yes, Canadian whisky can say \"rye\" on the label without actually containing any rye. This came to be when Canadian whisky gained popularity for it’s robust, spicy rye flavors, and people began to refer to Canadian whisky simply as rye. Eventually this associtation was reflected in the labeling, regardless of how much rye was in the bottle. Most Canadian bottles do contain rye, but it’s closer around 5-15% rye."},{"t":"h2","text":"Japanese Whisky"},{"t":"p","text":"Over the last 30 years Japanese whiskies reputation has progressed so much it is now considered on par with the finest whiskies in the world. Which is especially impressive considering they've been at it commercially for less than a century."},{"t":"p","text":"Japanese whisky's style and industry is modelled after scotch. Pot distilled single malts - sometimes peated, column distilled grain whisky and blends of the two. In general, Japanese single malts and their whisky in general, tends to be on the more delicate end, closer to inland scotch (not always of course). This does not mean lighter or weaker mind you, just subtler, but still wholly complex."}]}},{"id":"rum","name":"Rum","display":"rum","label":"Chapter two","essay":{"title":"Rum - an overview","blocks":[{"t":"p","text":"Rum is one of the oldest distilled spirits and it has one of the most colorful histories of any alcoholic beverage. By the mid-1700s, rum was being made throughout the Caribbean and South America. It soon became popular in New England and was produced there as well. Today, rum is produced throughout the world."},{"t":"p","text":"The use of sugar cane distinguishes rum from all other liquors. Many of the early Caribbean rums were produced with molasses and \"skimmings\" from the production of sugar. The skimmings were obtained from the boiling of the sugar cane and were mixed with molasses and \"dunder\" (leftover sediment in the still). The molasses-cane juice mixture is then fermented and distilled. Pot stills are used in many of the traditional rums, though most now use continuous column stills."},{"t":"p","text":"Many rums are then aged in wood casks. The type of wood used is often the determining factor in the color of rum produced in the end. It is important to note that climate plays a significant role in how long any distilled spirit is aged for and rum is no exception. The rums produced in tropical climates will generally be aged for a shorter period of time than those in cooler climates. That is why you may see a dark Caribbean rum aged for just three to five years while a North American rum of similar color and oaky flavor may be aged for around 10 years."},{"t":"p","text":"Many rum distillers will also use old bourbon barrels for aging because they cannot be reused in that whiskey's production. This can add some underlying whiskey-like flavors to the rum, something you'll also find in many tequilas."},{"t":"p","text":"The majority of rum is bottled at 40 percent alcohol by volume (80 proof). There are some exceptions, including overproof rums which can reach 160 proof. The higher alcohol content makes these a popular choice for lighting drinks on fire. Rum is produced throughout the world and each region and country have different laws and traditions that are used in its production. Each of these will give the individual rum various and distinct characteristics. Most will have a sweet flavour. The sweetness can vary widely and the flavour is also balanced with the smoothness, richness, smokiness, and drinkability."},{"t":"h2","text":"Types"},{"t":"p","text":"There are a number of styles of rum produced. Light, gold, dark, spiced, and flavoured rums are among the most popular. There are also origin-specific styles like cachaça and rhum agricole available."},{"t":"h3","text":"Light Rum"},{"t":"p","text":"Light-bodied rum is sometimes referred to as white or silver rum. It is the most common style of rum and is a very subtle liquor, much like vodka with a sweet tooth. These rums are generally aged in stainless steel tanks for up to a year and filtered before bottling. This process gives light rums their clean, light flavor. They are the most popular rums to use for cocktails like the Cuba Libre and among the most affordable rums on the market."},{"t":"h3","text":"Gold Rum"},{"t":"p","text":"Medium-bodied rums are often called gold or amber rum. They are often quite rich and surprisingly smooth. This taste profile is a result of either the production of congeners (organic compounds produced during production) or the addition of caramel. Gold rums are often aged in oak casks, which also contribute to their dark, smooth characteristics. Many of these rums make a smooth sipper and can be used in place of light rum in some darker cocktails."},{"t":"quote","text":"You could even think of them as the desserts of the rum world."},{"t":"h3","text":"Aged Rum"},{"t":"p","text":"Similar in color and body to gold rum, aged rums should be distinguished from their counterparts because these do not include any additives. The majority of \"dark\" rums fall into this category as well. Aged rums will obtain their golden color from the barrels that they are aged in. Because these rums are in contact with the wood for a longer time, they naturally pick up the flavors and colors of the barrel. Almost any aged rum can be mixed into drinks and many can stand on their own and enjoyed straight. They vary greatly in age, with the older rums costing more than younger bottlings."},{"t":"h3","text":"Dark Rum"},{"t":"p","text":"Heavy-bodied or dark rums are typically used in rum punches. It's also common to find them mixed along with a light rum in many tiki cocktails such as the popular hurricane. These are the richest rums that receive their flavor from aging in charred oak casks. Besides adding a rich, sweet flavor to cocktails, dark rums are the preferred sipper of the rum family, especially fine rums like Angostura 1824."},{"t":"p","text":"A subcategory of dark rum is those called blackstrap. These are made from the darkest molasses produced during the third boil while refining sugar. The resulting rum is equally as dark, rich, and thick. You could even think of them as the desserts of the rum world. Look for bottles like Cruzan Black Strap and Captain Morgan Black Spiced Rum."},{"t":"h3","text":"Overproof Rum"},{"t":"p","text":"Overproof or high-proof rum is often only used as a float in cocktails. This potent rum is 75 to 75 1/2 percent alcohol by volume (150 to 151 proof) and can be as dangerous to drink as Everclear if it is not diluted in some way. This is a popular rum for creating flamed drinks because the high alcohol content makes it easy to burn. If you are already drunk, don't try to play with fire in your drinks. Also, never use overproof liquors of any kind in cooking or near an open flame because they are highly flammable."},{"t":"h3","text":"Cachaça"},{"t":"p","text":"The Brazilian rum known as cachaça differs from others because it skips the molasses and instead uses pure sugar cane juice in the distillation process. By law, cachaça must be produced in Brazil. Cachaça is one of the sweetest rums available, though many people—particularly in Brazil—don't like to categorize it as a rum. Instead, it's often thought of as a unique distilled spirit that is its own category. The most famous cachaça cocktail is the caipirinha, Brazil's national drink. Yet, it is a fantastic mixer for a variety of cocktails, including those that typically use a standard rum."},{"t":"h3","text":"Rhum Agricole"},{"t":"p","text":"Similar to cachaça, rhum agricole is also distilled from pure sugar cane juice. While rum generally does not have tight regulations on its production, rhum agricole is an exception. Rhum agricole must be produced in the French territories, most commonly the island of Martinique, and it is governed by an AOC (appellation d’origine controlle), similar to Cognac. It is distilled from fresh-pressed sugar cane juice using a Creole continuous column still. The cane can only be harvested in the dry season and the juice must be extracted within three days."},{"t":"p","text":"Rhum agricole is noted for its grassy, sweet taste because sugar cane is a grass. The purity of the juice imparts a special flavor to this style of rum. Like most rums, it can be mixed into almost any cocktail you can think of."},{"t":"h3","text":"Flavoured Rum"},{"t":"p","text":"Flavouring rum by adding spices and aromatics during distillation became popular in the latter part of the 20th century. Coconut rum and spiced rum are the most popular and have been around the longest. You can also find mango, strawberry, and many other flavors to choose from. make your own infused rum."},{"t":"h2","text":"Using Rum"},{"t":"p","text":"Rum is one of the most popular liquors and it is used to create many cocktails, including the daiquiri and mojito. The sweet taste of rum makes it a versatile mixer and it is essential for any well-stocked bar. It can be used in anything from the great tropical drinks of the tiki scene to the warm drinks in the winter."}]}},{"id":"gin","name":"Gin","display":"gin","label":"Chapter three","essay":{"title":"Gin - an overview","blocks":[{"t":"p","text":"Someone, probably on the Internet, once told me gin was just juniper-flavoured vodka. But like asking Siri to do your taxes, it's not that simple. Both gin and vodka are made from neutral grain spirits (like rye, barley, wheat, corn) but gin gets steeped with botanicals (fancy word for dried herbs, roots, and citrus peels) and redistilled. So you might sip a gin and taste juniper and tell everyone at the bar I'M REALLY GETTING NOTES OF JUNIPER."},{"t":"p","text":"Whereas vodka is distilled and redistilled to a point where you taste the notes of the grain its made from, like hey, this vodka tastes like...wheat, whoa. In that line of thinking, you could start a bar argument that gin is juniper-flavored vodka, \"but in another sense, you're making something from that product that's completely new\" said O'Neill."},{"t":"p","text":"And when it comes to gin, beautiful, perfect gin, there are even more specific types, including Genever and Old Tom, that have distinct characteristics and usages and are totally worth seeking out."},{"t":"p","text":"Aged rums will obtain their golden color from the barrels that they are aged in. Because these rums are in contact with the wood for a longer time, they naturally pick up the flavors and colors of the barrel. Almost any aged rum can be mixed into drinks and many can stand on their own and enjoyed straight. They vary greatly in age, with the older rums costing more than younger bottlings."},{"t":"quote","text":"But like asking Siri to do your taxes, it's not that simple."},{"t":"h2","text":"London Dry"},{"t":"p","text":"London Dry, originating in...England...but produced all over the world, is what most people think of when they think of gin—and it's what you typically get in a G\u0026T or martini. You know the stuff: Beefeater, Tanqueray, Bombay Sapphire. You're definitely gonna get juniper, because juniper is the most dominant flavor within the gin and hence the reason it's called gin (juniper is genévrier in French).\" Juniper, mellows out when distilled. Some London Dry gins steep fresh citrus peels or dried peels before distillation and that gives them a bright, citrus flavour—and why a twist of lemon really does magic in a martini, bringing all of that out even more."},{"t":"p","text":"\"What's termed a 'dry gin' means there's no added (artificial) flavouring, the flavours are all natural from the botanicals,\" said our gin guide, plus no added sweeteners. \"If the gin has sweetness, it's more than likely it contained a botanical like liquorice.”"},{"t":"h2","text":"Plymouth"},{"t":"p","text":"Plymouth gin is technically a style of gin, but only one distillery produces it and it's one of the oldest recorded distilleries in the U.K. It's been through a lot–different owners, a little thing called World War II, the general progression of time and vodka."},{"t":"p","text":"Plymouth was very special because it named in the Savoy Cocktail Book, and it was in 23 gin recipes in the book. It was one of the most significant cocktail books in the world and still is to this day. So to have the actual name physically in it, is very very important. With that, it allowed Plymouth to become very popular in the first part of the 20th century when a lot of gins were coming onto the market.\" You can also tell the gin has history from the old school ship on the bottle—the British Royal Navy loved it so much they requested a higher proof gin just for them (seems like a good idea), and that's known as Navy Strength and the reason you have a Tweety Bird tattoo on your shoulder blade."},{"t":"p","text":"Flavour-wise, it's drier than London Dry and more citrus forward, and you might get a spicier finish from their blend of seven botanicals: juniper, coriander seed (adds acidity), dried sweet orange peels, cardamom, Angelica root, and Orris root. Because of those roots, said our gin guru, \"the gin has a bit of an earthier feel, and it's a little bit softer in juniper. It has a nice kind of oily texture, which works fantastic in things like martinis and negronis, anything that has a slightly bitter flavor, Plymouth gin work really, really well.\""},{"t":"h2","text":"Old Tom"},{"t":"p","text":"Old Tom is the corduroy-clad hipster of gins. After a quick discussion of the death rate versus birth rate in the 16th, 17th, and the 18th centuries, professor O'Neill basically said that back then, gin got a bad rap because so many people were making their own. And it was terrible. \"They would have used things like liquorice or a sweetening agent to actually sweeten the gin. So it became known as bathtub gin, that style. Old Tom was originally a sweetened style of gin that was produced and it came around the middle of the 18th century, and Old Tom was the street name for the gin.\""},{"t":"p","text":"Nowadays, it's taken a full turn, he said. \"Old Tom is very good gin, the botanicals are usually distilled, the sweetness in it normally comes from a larger amount of liquorice that's in the distillation; they don't add flavour after.\" It doesn't taste like licorice, in case you're wondering, but that different balance of ingredients affects the texture and \"perception of taste,\" said O'Neill. It's richer in flavor than London Dry, which is why \"Old Tom works better in mixed drinks and pre-Prohibition cocktails, anything that has bitter flavours.\" At the NoMad, they use it in a Tom Collins because it helps to bring the actual citrus down a notch in the traditionally lemony-sweet drink. O'Neill also recommends it in a Martinez (gin, sweet vermouth, maraschino liqueur, bitters)."},{"t":"p","text":"Ransom's Old Tom is aged in wine barrels, so it takes on that caramel color, but some Old Tom gins are clear, like Hayman's. Similarly, some use added sugars to sweeten while others rely on botanicals to do the trick. Different brands are creating their own take on the historic gin, so there's some leeway here, I just wish they'd bring back all the ads with cats in them."},{"t":"h2","text":"Genever"},{"t":"p","text":"This is the original style of gin, dating back to 16th-century Holland. The base grains are malted (so the grain starts to germinate aka liiiiive and then that process is halted), similar to whiskey, giving it a more robust flavor. It’s also flavored with juniper and botanicals, but less so than the other gin types."},{"t":"p","text":"Instead of using a neutral grain spirit, Genever distillers actually create a malt wine spirit, which is the predominant flavor of the gin. The grains are left to ferment for five days or so, and then turned into a mash, which is similar to how whiskey is made. Then they'll add different botanicals, including juniper, but the difference here between the dry gins and Genever is that juniper is not the predominant flavor. The actual gin is a lot more malty. Flavors added can be cloves, caraway, ginger, nutmeg. So you've got vaguely different style of taste, and you certainly have way more earth notes within it. You won't often taste citrus like with London Dry, some distillers don't even add it at all."},{"t":"p","text":"If Old Tom is considered \"rich\" in flavour, Genever is even richer, meaning it's best in rich cocktails, with something like sweet vermouth, or stirred with a tiny bit of bitters and a touch of sugar like a gin Old Fashioned. The idea is the malt wine has such a predominant flavour, if you're mixing it with something richer in flavour, it's going to work really well."}]}},{"id":"tequila","name":"Tequila","display":"tequila","label":"Chapter four","essay":{"title":"Tequila - an overview","blocks":[{"t":"p","text":"While the rest of the world distills their spirits from grain, fruit or sugar cane, Mexico does their own thing and makes their spirits from the native agave plant."},{"t":"quote","text":"Basically tequila is really just a style of mezcal."},{"t":"p","text":"The most common example is tequila, although mezcal has been gaining popularity in recent years. The difference? Basically tequila is really just a style of mezcal."},{"t":"h2","text":"Tequila vs Mezcal"},{"t":"p","text":"Flavour wise, the main difference is that mezcal typically has a pronounced smokiness, reminiscent of some types of scotch. This comes from the agave hearts being rooted in large earthen pits over hot rocks before being fermented. Tequila on the other hand is traditionally made by steaming the agave hearts or cooking them in ovens. This leaves tequila a cleaner and more grassy flavour without the smokiness."},{"t":"p","text":"The most common expressions of both tequila and mezcal are un-aged. Though some can be barrel aged for up to a few years, particularly for tequilas."},{"t":"p","text":"One thing to look for in both tequila and mezcal is that they are made with 100% agave on the label - ie, everything in the bottle was distilled from agave. If it doesn’t say this, it is called a mix and will contain up to 49% non-agave spirit. These are much cheaper and much lower in quality. Many of the most visible brands are ‘mixtos’ and probably what you drank when you ordered tequila shots at a cheap student bar. Probably best to avoid these when making cocktails."},{"t":"h2","text":"Maturation and Barrel Aging"},{"t":"p","text":"Tequila is aged more frequently than mezcal, but they both have similar classifications, though not identical. American oak barrels are typically used, ex-bourbon casks are common."},{"t":"p","text":"The following classifications are used to show how long the tequila or mezcal has been aged."},{"t":"p","text":"Blanco: Or ‘white’ for tequila, For mezcal this is often labelled as ‘Young’ or ‘Joven’. These are clear spirits. While they have no barrel influence they will often rest in neutral containers to allow them to mellow before bottling. Confusingly there is also a separate ‘Joven’ category also called gold tequila, which usually lower quality. So: Joven Mezcal = good, Joven Tequila = bad (mostly)"},{"t":"p","text":"Resposado: or ‘rested’. Aged for two months up to one year in casks as large as 20,000 litres."},{"t":"p","text":"Añejo: aged from one to three years. Tequila casks may be no larger than 600 litres, 200 for mezcal."},{"t":"p","text":"Extra-añejo: ‘Ultra-aged’. This is only a tequila category. Aged in small barrels for a minimum of three years and often longer."},{"t":"p","text":"The longer the tequila is aged the smoother the final spirit tends to be. The tequila or mezcal can also pick up flavour from the oak barrels."}]}},{"id":"other-spirits","name":"Other spirits","display":"other spirits","label":"Chapter five","essay":null},{"id":"bar-building","name":"Bar building","display":"bar building","label":"Chapter six","essay":{"title":"Building your bar","blocks":[{"t":"p","text":"Building up your bar can feel like a daunting task - where do you start, how many bottles should you buy and what do you need to be able to whip out a couple of great cocktails on a whim."},{"t":"p","text":"It all really depends on the drinks that you like and what your think your guests will enjoy. A good rule of thumb is to start with a couple of classics that you like and buy the one, two or three spirits that you need to make that cocktail. Adding one or two more bottles could unlock more drinks."},{"t":"p","text":"The table which follows shows the spirits you need to make specific drinks and should help you figure out in what order you want to add bottles to your bar."},{"t":"p","text":"The spirits down the left side are the primary base spirits, generally the ones you can use to make a cocktail with just that one spirit. The spirits along the top are typically used to mix with the main spirits to make more cocktails."},{"t":"p","text":"So how do you use this to figure out how to build your bar?"},{"t":"p","text":"Find a drink you like, I suggest starting with drinks in the first few columns, and use the table to work out which bottles you need. (You may also need other ingredients like bitters and syrups etc, the table only helps you with the spirits)"},{"t":"p","text":"Once you’re comfortable with that drink look to the cells to the left or right to see what you can make if you add an additional one or two bottles. Or pick another base spirit and start there."},{"t":"h2","text":"The bar table"}]}}],"recipes":[{"id":"old-fashioned","title":"The Old Fashioned","subtitle":"","chapter":"whiskey","order":1,"glass":"rocks","technique":"stirred","base":"Rye or Bourbon","bottles":["whiskey"],"cell":"whiskey×none","era":[],"character":[],"photo":"","intro":["The Old Fashioned has a pretty fair claim to being the original cocktail (though plenty of others have a stake in that as well, the mint julep for one). The first definition of a \"cocktail\" in print, that we know of anyway, appeared in a periodical published in 1806. It states that a “cock-tail” is \"a stimulating liquor, composed of spirits of any kind, sugar, water, and bitters.” As you can see, that's essentially the recipe listed here - today we use ice instead of water. So, back then, a \"cocktail\" made with whiskey was simply called a \"whiskey cocktail.\" Dutch gin and brandy were also commonly used.","Jumping ahead to the end of the 19th century when the Gilded Age was in full swing and opulence was all the rage, it had become fashionable to spruce up the standard whiskey cocktail with a dash or two of imported ingredients like absinthe or curaçao. These were known as \"fancy\" or \"improved\" cocktails. But not everyone was into these modern embellishments, and traditionalists began to order their whiskey cocktails \"in the old fashion,\" which how we got the name we use today."],"main":{"ings":[{"text":"2 oz Rye or Bourbon","q1":2.0,"q2":null,"qual":"","rest":"Rye or Bourbon","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1 teaspoon demerara syrup","q1":1.0,"q2":null,"qual":"","rest":"demerara syrup","unit":"teaspoon","unitPl":"teaspoons","kind":"count"},{"text":"(Or 1/4 oz Simple Syrup)","kind":"asis"},{"text":"2 dashes Angostura bitters","q1":2.0,"q2":null,"qual":"","rest":"Angostura bitters","unit":"dash","unitPl":"dashes","kind":"count"},{"text":"1 dash Orange bitters","q1":1.0,"q2":null,"qual":"","rest":"Orange bitters","unit":"dash","unitPl":"dashes","kind":"count"},{"text":"Orange Peel for Garnish","kind":"asis"}],"method":[{"text":"In a chilled mixing glass, combine the whiskey, sugar, and bitters. Fill it with ice and stir for 18-25 seconds. Strain the cocktail into a chilled rocks glass over ice - preferably one large cube. Express the oils of the lemon and orange peels and add them into the glass.","alt":false},{"text":"Alternatively, combine all ingredients in a rocks glass. Stir them with ice, garnish and serve.","alt":true}]},"variations":[]},{"id":"sazerac","title":"Sazerac","subtitle":"","chapter":"whiskey","order":2,"glass":"rocks","technique":"stirred","base":"Rye or Bourbon","bottles":["whiskey","absinthe"],"cell":"whiskey×absinthe","era":[],"character":[],"photo":"","intro":["The Sazerac is one of the seminal cocktails of the pre-Prohibition era and is the official cocktail of New Orleans, and a close relative of the Old Fashioned, (both centre around whiskey, sugar, and bitters). But a few tweaks and a unique preparation propel the Sazerac into a completely different realm.","It is a drink of delicate aromatic layers that need to be placed just so, so that one doesn't overwhelm the other. As such, the preparation involves a few additional steps, most notably the glass being rinsed with absinthe (which will not make you hallucinate) before the cocktail is poured in.","Another hallmark characteristic of the Sazerac is that it's served in a rocks glass with no ice and no garnish, which looks very plain. But I think that’s part of its charm. The Sazerac is a prince dressed like a pauper, and a worthy - I'd even go as far as to say essential - addition to your cocktail arsenal."],"main":{"ings":[{"text":"2 oz Rye or Bourbon","q1":2.0,"q2":null,"qual":"","rest":"Rye or Bourbon","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1 teaspoon demerara syrup","q1":1.0,"q2":null,"qual":"","rest":"demerara syrup","unit":"teaspoon","unitPl":"teaspoons","kind":"count"},{"text":"4 dashes Peychaud’s bitters","q1":4.0,"q2":null,"qual":"","rest":"Peychaud’s bitters","unit":"dash","unitPl":"dashes","kind":"count"},{"text":"1 dash Angostura bitters","q1":1.0,"q2":null,"qual":"","rest":"Angostura bitters","unit":"dash","unitPl":"dashes","kind":"count"},{"text":"Splash of Absinthe","kind":"asis"},{"text":"Lemon Peel for Garnish","kind":"asis"}],"method":[{"text":"Fill a rocks glass with ice and set it aside to chill.In a chilled mixing glass, combine all ingredients, except the absinthe, fill with ice and stir for 10-12 seconds.","alt":false},{"text":"Dump the ice out of the chilling rocks glass and add the splash of absinthe. Swirl the glass around - or toss it up in the air - so that the absinthe fully coats of the sides of the glass, then dump it out (or drink it!).","alt":false},{"text":"Stir the cocktail a few more times and strain it into the rocks glass. Do not add any ice! Hold the lemon peel 4-6 inches above the glass and express its oils over the drink. the lemon peel while. Discard the peel, do not place it in the glass.","alt":false}]},"variations":[]},{"id":"manhattan","title":"Manhattan","subtitle":"","chapter":"whiskey","order":3,"glass":"coupe","technique":"stirred","base":"Rye or Bourbon","bottles":["whiskey","sweet-vermouth"],"cell":"whiskey×sweet-vermouth","era":[],"character":[],"photo":"","intro":[],"main":{"ings":[{"text":"2 1/2 oz Rye or Bourbon","q1":2.5,"q2":null,"qual":"","rest":"Rye or Bourbon","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1 oz Sweet Vermouth (3/4 oz for Bourbon)","q1":1.0,"q2":null,"qual":"","rest":"Sweet Vermouth (3/4 oz for Bourbon)","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"2 dashes Angostura Bitters","q1":2.0,"q2":null,"qual":"","rest":"Angostura Bitters","unit":"dash","unitPl":"dashes","kind":"count"}],"method":[{"text":"Combine all ingredients in a chilled mixing glass. Fill with ice, stir for 18-25 seconds. Then strain into a chilled coupe or martini glass. Garnish with a cherry, if you have one.","alt":false},{"text":"A Manhattan is also mighty fine served on the rocks.","alt":false}]},"variations":[]},{"id":"perfect-manhattan","title":"Perfect Manhattan","subtitle":"","chapter":"whiskey","order":4,"glass":"coupe","technique":"stirred","base":"Rye or Bourbon","bottles":["whiskey","sweet-vermouth","dry-vermouth"],"cell":"whiskey×dry-vermouth","era":[],"character":[],"photo":"","intro":["The perfect Manhattan is made with both sweet and dry vermouth - that's not to say that the traditional Manhattan above is somehow imperfect, this is just a different way of thinking about the same drink. Kind of like a dirty or dry Martini.","Bourbon tends to work better in the perfect Manhattan because the additional sweetness balances out the dry vermouth better"],"main":{"ings":[{"text":"2 1/2 oz Rye or Bourbon","q1":2.5,"q2":null,"qual":"","rest":"Rye or Bourbon","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1/2 oz Sweet Vermouth","q1":0.5,"q2":null,"qual":"","rest":"Sweet Vermouth","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1/2 oz Dry Vermouth","q1":0.5,"q2":null,"qual":"","rest":"Dry Vermouth","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"2 dashes Angostura Bitters","q1":2.0,"q2":null,"qual":"","rest":"Angostura Bitters","unit":"dash","unitPl":"dashes","kind":"count"},{"text":"Orange Peel for garnish","kind":"asis"}],"method":[{"text":"Combine all ingredients in a chilled mixing glass. Fill with ice, stir for 18-25 seconds. Then strain into a chilled coupe or martini glass. Express the oils of the orange peel and add it into the glass.","alt":false}]},"variations":[]},{"id":"whiskey-sour","title":"Whiskey Sour","subtitle":"","chapter":"whiskey","order":5,"glass":"rocks","technique":"shaken","base":"Bourbon or Rye","bottles":["whiskey"],"cell":"whiskey×none","era":[],"character":[],"photo":"","intro":[],"main":{"ings":[{"text":"2 oz Bourbon or Rye","q1":2.0,"q2":null,"qual":"","rest":"Bourbon or Rye","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"3/4 oz lemon juice","q1":0.75,"q2":null,"qual":"","rest":"lemon juice","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"3/4 oz simple syrup","q1":0.75,"q2":null,"qual":"","rest":"simple syrup","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1/4 oz egg white (Optional)","q1":0.25,"q2":null,"qual":"","rest":"egg white (Optional)","unit":"oz","unitPl":"oz","kind":"oz"}],"method":[{"text":"Combine all ingredients into a shaker, if using egg white, \"dry shake\" without ice first for about 4-5 seconds. Then add ice and shake hard for 10 seconds. Strain into a chilled rocks glass over fresh ice cubes. Garnish with an orange half wheel and a cherry.","alt":false}]},"variations":[]},{"id":"mint-julep","title":"Mint Julep","subtitle":"","chapter":"whiskey","order":6,"glass":"julep","technique":"built","base":"Bourbon","bottles":["whiskey"],"cell":"whiskey×none","era":[],"character":[],"photo":"","intro":["The mint julep is one of the oldest drinks you're going to run into, and like the old fashioned, one of the simplest. There are only 3 ingredients and it's prepared in the glass it's served in. The secret to this drink is to use crushed ice and allowing enough time for the drink to dilute.","The mint julep is best known for being the official drink of the Kentucky Derby, where every year more than 120,000 of these are served in a single day.","Mint juleps make for an excellent summer drink and are one of the few whiskey cocktails more at home on a deck than by a fireplace."],"main":{"ings":[{"text":"2 1/2 oz Bourbon","q1":2.5,"q2":null,"qual":"","rest":"Bourbon","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1/2 oz simple syrup or scant 1/2 oz demerara syrup","q1":0.5,"q2":null,"qual":"","rest":"simple syrup or scant 1/2 oz demerara syrup","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"10-12 mint leaves (no stems)","q1":10.0,"q2":12.0,"qual":"","rest":"mint leaves (no stems)","unit":"","unitPl":"","kind":"count"},{"text":"2 mint sprigs for garnish","kind":"asis"}],"method":[{"text":"In a Julep cup or rocks glass muddle the mint leaves with the simple syrup and add the whiskey. Be careful not to over muddle, you want to bruise the leaves to release the oils, not break them down completely. Fill 3/4 way with crushed ice and stir for a whole minute. You want to start melting the ice while keeping the mint at the bottom. Add more ice if needed.","alt":false},{"text":"When finished, add more crushed ice into a mound above the glass. Garnish with a mint sprig and serve with a short straw.","alt":false}]},"variations":[]},{"id":"vieux-carre","title":"Vieux Carré","subtitle":"","chapter":"whiskey","order":7,"glass":"rocks","technique":"stirred","base":"Rye and Cognac","bottles":["whiskey","cognac","sweet-vermouth","benedictine"],"cell":"whiskey×sweet-vermouth","era":[],"character":[],"photo":"","intro":["This New Orleans cocktail is close relative of the Manhattan, but is more complex and like all things New Orleans, a bit more decadent.","Vieux Carré translates to 'Old Square' and is another name for the French Quarter in New Orleans.","The traditional recipe calls fro equal parts of whiskey, cognac and sweet vermouth which can come off as a bit sweet and may have you wishing you'd just made a Manhattan instead.","The version below bumps up the whiskey, pulls back a bit on the vermouth and uses 2 rather than one dash of each of the bitters. This helps balance the drink better while maintaining the complexity, richness and elegance of the drink."],"main":{"ings":[{"text":"1 1/4 oz Rye","q1":1.25,"q2":null,"qual":"","rest":"Rye","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1 oz Cognac","q1":1.0,"q2":null,"qual":"","rest":"Cognac","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1 oz (scant) Sweet Vermouth","q1":1.0,"q2":null,"qual":"","rest":"(scant) Sweet Vermouth","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1 teaspoon Benedictine","q1":1.0,"q2":null,"qual":"","rest":"Benedictine","unit":"teaspoon","unitPl":"teaspoons","kind":"count"},{"text":"2 dashes Angostura Bitters","q1":2.0,"q2":null,"qual":"","rest":"Angostura Bitters","unit":"dash","unitPl":"dashes","kind":"count"},{"text":"2 dashes Peychaud's Bitters","q1":2.0,"q2":null,"qual":"","rest":"Peychaud's Bitters","unit":"dash","unitPl":"dashes","kind":"count"},{"text":"lemon peel for garnish","kind":"asis"}],"method":[{"text":"Combine all ingredients into a chilled mixing glass. Fill with ice and stir for 15-25 seconds. Strain into a chilled rocks glass over ice, preferably one large cube. Express the oils from the lemon peel and garnish.","alt":false}]},"variations":[]},{"id":"man-o-war","title":"Man O'War","subtitle":"","chapter":"whiskey","order":8,"glass":"coupe","technique":"shaken","base":"Bourbon (or Rye)","bottles":["whiskey","orange-curacao","sweet-vermouth"],"cell":"whiskey×orange-curacao","era":[],"character":[],"photo":"","intro":["Though not as well known as it's cousin, the mint julep, the man o'war has a long association with horse racing and is named after one of the greatest horses in the Kentucky Derby's history.","The drink is often overshadowed by more mainstream bourbon or rye cocktails, but it's a flavourful drink that stands up well to food."],"main":{"ings":[{"text":"1 1/2 oz Bourbon (or Rye)","q1":1.5,"q2":null,"qual":"","rest":"Bourbon (or Rye)","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1 oz Dry Curacao (Or Cointreau)","q1":1.0,"q2":null,"qual":"","rest":"Dry Curacao (Or Cointreau)","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1/2 oz Sweet Vermouth","q1":0.5,"q2":null,"qual":"","rest":"Sweet Vermouth","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1/2 oz lemon juic","q1":0.5,"q2":null,"qual":"","rest":"lemon juic","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"Cherry and lemon peel for garnish","kind":"asis"}],"method":[{"text":"Combine all ingredients into a shaker and fill halfway with ice. Shake for at least 20 seconds. Strain the drink into a chilled coupe or Nick and Nora glass. Garnish with a speared cherry and lemon peel.","alt":false}]},"variations":[]},{"id":"paper-plane","title":"Paper Plane","subtitle":"","chapter":"whiskey","order":9,"glass":"coupe","technique":"shaken","base":"Bourbon","bottles":["whiskey","amaro-nonino","aperol"],"cell":"","era":[],"character":[],"photo":"","intro":[],"main":{"ings":[{"text":"3/4 oz Amaro Nonino","q1":0.75,"q2":null,"qual":"","rest":"Amaro Nonino","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"3/4 oz Aperol","q1":0.75,"q2":null,"qual":"","rest":"Aperol","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"3/4 oz Bourbon","q1":0.75,"q2":null,"qual":"","rest":"Bourbon","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"3/4 oz fresh lemon juice","q1":0.75,"q2":null,"qual":"","rest":"fresh lemon juice","unit":"oz","unitPl":"oz","kind":"oz"}],"method":[{"text":"Combine amaro, Aperol, bourbon, and lemon juice in a cocktail shaker. Fill with ice and shake vigorously until outside of shaker is frosty, about 20 seconds. Strain into 2 coupe glasses","alt":false}]},"variations":[]},{"id":"daiquiri","title":"Daiquiri","subtitle":"","chapter":"rum","order":1,"glass":"coupe","technique":"shaken","base":"White Rum","bottles":["white-rum"],"cell":"white-rum×none","era":[],"character":[],"photo":"","intro":["The Daiquiri is one of my all-time favorite cocktails. It is also widely misunderstood. When many people picture a Daiquiri, it's in the form of brightly colored slush being dispatched from a machine operated by a lever. But this could not be further from the reality.","A true Daiquiri is simply white rum, lime juice, and sugar (or simple syrup), shaken and served up in a cocktail glass. No strawberries, no blender, no tiny umbrella. Today, in the midst of the revival, it is universally beloved by the bar industry, enjoying a level of adoration unmatched by any other drink, and that's no exaggeration.","As the recipe indicates, I like a little more lime than simple syrup in my Daiquiris. But everyone one is different, feel free to tinker with the balance. The lime disc, which is just a round peel, is to punch up the limey-ness a hair more. I really think it caps the drink off. It's not a dealbreaker by any means, but if you take the extra step, I don't think you'll be disappointed."],"main":{"ings":[{"text":"2 oz White Rum","q1":2.0,"q2":null,"qual":"","rest":"White Rum","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"3/4 oz lime juice","q1":0.75,"q2":null,"qual":"","rest":"lime juice","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"3/4 oz simple syrup","q1":0.75,"q2":null,"qual":"","rest":"simple syrup","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"Lime disc for garnish","kind":"asis"}],"method":[{"text":"Combine all ingredients in a shaker, except for the lime disc. Fill with ice, shake for 8-10 seconds and fine strain into a chilled coupe glass. Express the oils of the disc and any juice over the top (shouldn't be more than 4-6 drops), swirl the disc in the glass once to integrate and then discard.","alt":false}]},"variations":[]},{"id":"strawberry-daiquiri","title":"Strawberry Daiquiri","subtitle":"","chapter":"rum","order":2,"glass":"coupe","technique":"shaken","base":"White Rum","bottles":["white-rum"],"cell":"white-rum×none","era":[],"character":[],"photo":"","intro":[],"main":{"ings":[{"text":"2 oz White Rum","q1":2.0,"q2":null,"qual":"","rest":"White Rum","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"3/4 oz lime juice","q1":0.75,"q2":null,"qual":"","rest":"lime juice","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"3/4 oz simple syrup","q1":0.75,"q2":null,"qual":"","rest":"simple syrup","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"Lime disc for garnish","kind":"asis"},{"text":"1 strawberry","q1":1.0,"q2":null,"qual":"","rest":"strawberry","unit":"","unitPl":"","kind":"count"}],"method":[{"text":"Muddle the strawberry into the simple syrup. Combine with all other ingredients in a shaker, except for the lime disc. Fill with ice, shake for 8-10 seconds and fine strain into a chilled coupe glass. Express the oils of the disc and any juice over the top (shouldn't be more than 4-6 drops), swirl the disc in the glass once to integrate and then discard.","alt":false}]},"variations":[]},{"id":"hemingway-daiquiri","title":"Hemmingway Daiquiri","subtitle":"","chapter":"rum","order":3,"glass":"coupe","technique":"shaken","base":"White Rum","bottles":["white-rum","maraschino"],"cell":"","era":[],"character":[],"photo":"","intro":["The popular backstory for this drink is it was a favourite Daiquiri variation of Ernest Hemingway, and one he personally specified while living in Cuba. But that is a bit of revisionist history. It’s true that Hemingway enjoyed Daiquiris with grapefruit and maraschino, and that he had a particular way he liked them, but that is not the recipe I have printed here. Hemingway liked Daiquiris with double the rum, double the citrus and without any sugar, a drink I wouldn’t recommend to anyone.","As Jeff “Beachbum” Berry accurately puts it in his fantastic book, Potions of the Caribbean: “Hemingway…was an alcoholic. And alcoholics do not make good drinks. They make strong drinks.” Also, adding grapefruit and maraschino wasn't Hemingway's idea.","Proper balance in a Hemingway Daiquiri is a matter of opinion (and I disagree with Hemingway's). I stand by the proportions I list here, but feel free to tweak them to find your personal perfect Hemingway.","The primary area of disagreement centres around the simple syrup and maraschino proportions. Some recipes leave simple syrup out entirely to preserve some measure of Hemingway’s original preferences. But as I alluded to above, I am less concerned with that. I think simple syrup is essential. It helps to soften the sharply pungent maraschino and build a bridge between it and the citrus.","I still like the maraschino to have a very present flavor, which is why I use ½ an ounce. But if you find that too overbearing - many do - you might want to invert the simple syrup and maraschino proportions, so there’s just a hint of maraschino in the background.","I prefer a rich simple syrup - or better yet a heavy teaspoon of raw sugar dissolved right into the citrus juice - because the drink comes out a little more concentrated and with a better body. But that’s definitely splitting hairs. Plain 1:1 simple syrup is great too."],"main":{"ings":[{"text":"2 oz White Rum","q1":2.0,"q2":null,"qual":"","rest":"White Rum","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"3/4 oz lime juice","q1":0.75,"q2":null,"qual":"","rest":"lime juice","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1/2 oz grapefruit juice","q1":0.5,"q2":null,"qual":"","rest":"grapefruit juice","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1/2 oz marchino","q1":0.5,"q2":null,"qual":"","rest":"marchino","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1/4 oz cane syrup or 2 teaspoons simple syrup","q1":0.25,"q2":null,"qual":"","rest":"cane syrup or 2 teaspoons simple syrup","unit":"oz","unitPl":"oz","kind":"oz"}],"method":[{"text":"Combine all ingredients in a shaker, if using raw sugar stir it with the citrus juice for 30 seconds first. Fill with ice and shake for 8-10 seconds and strain into a chilled coupe glass. Express the oils from a grapefruit peel, stir in with peel, and discard.","alt":false}]},"variations":[]},{"id":"rum-old-fashioned","title":"Rum Old Fashioned","subtitle":"","chapter":"rum","order":4,"glass":"rocks","technique":"stirred","base":"Dark Rum","bottles":["dark-rum"],"cell":"dark-rum×none","era":[],"character":[],"photo":"","intro":[],"main":{"ings":[{"text":"2 oz Dark Rum","q1":2.0,"q2":null,"qual":"","rest":"Dark Rum","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"Teaspoon demerara syrup","kind":"asis"},{"text":"2 dashes Angostura bitters","q1":2.0,"q2":null,"qual":"","rest":"Angostura bitters","unit":"dash","unitPl":"dashes","kind":"count"},{"text":"1 dash orange bitters","q1":1.0,"q2":null,"qual":"","rest":"orange bitters","unit":"dash","unitPl":"dashes","kind":"count"},{"text":"Orange peel for garnish","kind":"asis"}],"method":[{"text":"In a chilled mixing glass, combine the whiskey, sugar, and bitters. Fill it with ice and stir for 18-25 seconds. Strain the cocktail into a chilled rocks glass over ice - preferably one large cube. Express the oils of the lemon and orange peels and add them into the glass.","alt":false}]},"variations":[]},{"id":"mojito","title":"Mojito","subtitle":"","chapter":"rum","order":5,"glass":"highball","technique":"shaken","base":"White Rum","bottles":["white-rum"],"cell":"white-rum×none","era":[],"character":[],"photo":"","intro":["Few drinks are as widely known - and widely enjoyed - as the Mojito. It is perhaps second only to the Margarita in that regard. It was one of the original ring-leaders of the modern cocktail movement back in the 90's and a primary driver of the idea that fresh ingredients actually make a huge a difference in cocktail quality, for which I am eternally grateful. Today the it remains among the tastiest cocktails you'll encounter.","Born of Cuban origins, a Mojito is very simple to make, it is nothing more than a Daiquiri with muddled mint served in a tall glass with soda water (aka a Southside Fizz with white rum). The key to making one that meets the it's potential as the ultimate summer refreshment is the ice (along with quality ingredients and accurate measuring, of course).","What you want are small-ish ice cubes. Not as fine as crushed ice, but not as large as what you’d get from a standard
