  /* ================= MIXING MODE ================= */
  // "shake for 10-12 seconds", "stir for a whole minute" → a timer in mixing mode (no g flag: used with match)
  const TIMER_RE =
    /\b(stir|shake|shaken|stirred|dry shake)\b[^.]*?\bfor\s+(?:about\s+|at least\s+|a\s+)?(?:(\d+)\s*(?:-|–|to)\s*)?(\d+|whole minute|minute)\s*(seconds?|secs?)?/i;
  function mixSteps(r, b) {
    const steps = [];
    const text = b.method
      .filter((s) => !s.alt)
      .map((s) => s.text)
      .join(' ');
    const chill = text.match(/chilled ((?:(?!mixing)[a-z' ])+?glass(?:es)?)/i);
    if (chill && !/^(fill|chill)/i.test(text))
      steps.push({ text: `Chill the ${chill[1].replace(/^(a|the)\s+/i, '')}.`, timers: [] });
    b.method
      .filter((s) => !s.alt)
      .forEach((s) => {
        s.text
          .replace(/([.!?])\s*(?=[A-Z(])/g, '$1\u0000')
          .split('\u0000')
          .map((t) => t.trim())
          .filter(Boolean)
          .forEach((t0) => {
            let t = t0;
            if (
              steps.length &&
              !/^\(?(combine|add|fill|stir|shake|strain|fine|garnish|express|muddle|top|pour|dump|swirl|hold|discard|chill|squeeze|gently|briefly|dry|rinse|rim|serve|set|place|mix|prepare|cut|let|use|build|float|layer|infuse|make|then|when|if|in|into|once|using|do|after|repeat|leave|remove|return|taste|keep|transfer|lightly|finally|optionally|next|first|to|or)\b/i.test(
                t,
              )
            ) {
              const prev = steps[steps.length - 1];
              prev.text += ' ' + t;
              t = prev.text;
              steps.pop();
            }
            const tm = [];
            const m = t.match(TIMER_RE);
            if (m) {
              const minute = /minute/i.test(m[3]);
              if (minute || m[4]) {
                const hi = minute ? 60 : +m[3];
                tm.push({ verb: /shak/i.test(m[1]) ? 'shake' : 'stir', lo: m[2] ? +m[2] : hi, hi });
              }
            }
            steps.push({ text: t, timers: tm });
          });
      });
    return steps;
  }
  let tickTimer = null,
    wakeLock = null;
  async function keepAwake(on) {
    try {
      if (on && 'wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
        state.awake = true;
      } else if (!on && wakeLock) {
        await wakeLock.release();
        wakeLock = null;
      }
    } catch (e) {
      state.awake = false;
    }
    const el = document.getElementById('awake');
    if (el) el.style.display = state.awake ? 'flex' : 'none';
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && state.mix) keepAwake(true);
  });
  function timerHtml(t) {
    const el = t.phase === 'idle' ? 0 : t.elapsed;
    const left = Math.max(0, t.hi - el);
    const prog = Math.min(1, el / t.hi);
    const st =
      t.phase === 'idle'
        ? ['Ready', `Tap as you start to ${t.verb}.`]
        : t.phase === 'done'
          ? ['Done', 'Strain now. Tap to go again.']
          : el >= t.lo
            ? ['Good', `Strain any time up to ${t.hi} s — tap to stop.`]
            : [t.verb === 'shake' ? 'Shaking' : 'Stirring', 'Keep going — tap to stop.'];
    return `<button class="ring" type="button" data-act="timer" aria-label="${t.phase === 'running' ? 'Stop' : 'Start'} the ${t.hi} second ${t.verb}">
    <svg width="100%" height="100%" viewBox="0 0 200 236" aria-hidden="true"><path d="M14 230 V100 A86 86 0 0 1 186 100 V230 Z" fill="var(--cx-raised)" stroke="var(--cx-rule-strong)" stroke-width="1.5"/><path d="M14 230 V100 A86 86 0 0 1 186 100 V230" fill="none" stroke="var(--cx-gold)" stroke-width="4" pathLength="100" stroke-dasharray="100" stroke-dashoffset="${(100 * (1 - prog)).toFixed(1)}"/></svg>
    <span class="face"><span class="big">${t.phase === 'done' ? '✓' : t.phase === 'idle' ? t.hi : left}</span><span class="eyebrow" style="font-size:11px">${t.phase === 'idle' ? 'seconds' : t.phase === 'done' ? 'done' : 'seconds left'}</span></span></button>
    <div style="display:flex;flex-direction:column;gap:8px"><p class="eyebrow">${st[0]}</p><p style="margin:0;font-style:italic;font-size:17px;color:var(--cx-muted)">${st[1]}</p>${t.lo !== t.hi ? `<p class="meta">${t.lo}–${t.hi} seconds</p>` : ''}</div>`;
  }
  function viewMix(id) {

    return `<div class="screen mix">

      ${gar.length ? `<div class="callout"><div><p class="eyebrow" style="font-size:11px">Garnish</p><b>${gar.map(esc).join('; ')}</b></div></div>` : ''}
      ${r.technique ? `<div class="callout"><div><p class="eyebrow" style="font-size:11px">Technique</p><b>${esc(techName(r.technique))}</b></div></div>` : ''}

    <div class="mix-body">
      <section class="mix-ings" aria-label="Ingredients">${b.ings.map((ing, k) => `<button type="button" class="mix-ing" data-act="mtick" data-arg="${k}" aria-pressed="${!!mix.ticks[k]}"><span class="box">${icons.tick}</span><span class="amount">${esc(fmtAmount(ing, n))}</span><span class="nm">${ingRest(ing, n)}</span></button>`).join('')}</section>
      <section class="mix-steps" aria-label="Steps">${stepHtml}</section></div></div>`;
  }

  /* ================= MY BAR ================= */
  function barModel() {
    const own = state.own;
    const withM = data.recipes
      .filter((r) => r.bottles.length)
      .map((r) => ({ r, miss: r.bottles.filter((b) => !own[b]) }));
    const ready = withM.filter((x) => !x.miss.length),
      one = withM.filter((x) => x.miss.length === 1),
      more = withM.filter((x) => x.miss.length > 1);
    const unlock = {};
    one.forEach((x) => {
      (unlock[x.miss[0]] = unlock[x.miss[0]] || []).push(x.r);
    });
    const add = Object.keys(unlock)
      .map((k) => ({ k, n: bname(k), rs: unlock[k] }))
      .sort((a, b) => b.rs.length - a.rs.length || a.n.localeCompare(b.n));
    return { withM, ready, one, more, add };
  }
  function bottleButtons(list) {
    return list
      .map(
        (b) =>
          `<button type="button" class="bottle" data-act="own" data-arg="${esc(b.id)}" aria-pressed="${!!state.own[b.id]}"><span class="box">${icons.tick}</span>${esc(b.name)}</button>`,
      )

  }
  const awayList = (add, max) =>
    add
      .slice(0, max)
      .map(
        (a) =>
          `<div class="away"><span class="num">${a.rs.length}</span><div class="w"><b>${esc(a.n)}</b><p>${a.rs.map((r) => `<a class="xref" href="#/r/${encodeURIComponent(r.id)}" style="text-decoration:none">${esc(r.title)}</a>`).join(' · ')}</p></div><button type="button" class="btn" data-act="own" data-arg="${esc(a.k)}|1" style="padding:0 14px">${icons.plusSm}I have it</button></div>`,
      )
      .join('');
  const makeGrid = (m) =>
    `<div class="make-grid">${m.ready.map((x) => `<a href="#/r/${encodeURIComponent(x.r.id)}">${dia()}<span class="n"><b>${esc(x.r.title)}</b><i>${esc(chaptersById[x.r.chapter].name)}</i></span></a>`).join('')}</div>`;
  function barHead(title, side) {
    return `<header class="bar-head"><div>${backBtn('#/')}<h1 class="display" style="margin-top:2px">${title}</h1></div><span style="flex:1"></span>${side || ''}${settingsButton()}</header>${rule2('margin:14px 32px 0')}`;
  }
  const modeSeg = (cur) =>
    `<div class="seg mode-seg narrow-only" role="tablist" aria-label="My bar"><a role="tab" href="#/bar" aria-selected="${cur === 'tonight'}">Tonight</a><a role="tab" href="#/plan" aria-selected="${cur === 'plan'}">Plan a bar</a></div>`;
  function tonightBody(m) {

      return emptyBox(

    ${
      m.add.length
        ? `<div class="big-count" style="margin-top:28px"><span class="num" style="font-size:44px">${m.one.length}</span><span class="display" style="font-size:24px">more, one bottle away</span></div>

  function viewBar() {

        .map(([g, n]) => {

  /* ================= PLAN A BAR ================= */
  function planModel() {
    const sel = data.recipes.filter((r) => state.plan[r.id] && r.bottles.length);
    const use = {};
    sel.forEach((r) =>
      r.bottles.forEach((k) => {
        (use[k] = use[k] || []).push(r);
      }),
    );
    const keys = Object.keys(use).sort(
      (a, b) => use[b].length - use[a].length || bname(a).localeCompare(bname(b)),
    );
    const bar = new Set(keys.concat(Object.keys(state.own)));
    const free = data.recipes.filter(
      (r) => !state.plan[r.id] && r.bottles.length && r.bottles.every((k) => bar.has(k)),
    );
    const buy = keys.filter((k) => !state.own[k]);
    const onlyFor = (r) => r.bottles.filter((k) => use[k] && use[k].length === 1 && !state.own[k]);
    const f = state.pfocus;
    let litD = null,
      litB = null;
    if (f && f.t === 'b' && use[f.k]) litD = new Set(use[f.k].map((r) => r.id));
    if (f && f.t === 'd' && state.plan[f.k] && recipesById[f.k]) litB = new Set(recipesById[f.k].bottles);
    return { sel, use, keys, free, buy, onlyFor, f, litD, litB };
  }
  function planDrinkRows(plan, compact) {
    if (!plan.sel.length)
      return emptyBox(
        'Nothing ticked yet',

          ? '<button class="btn btn-primary" type="button" data-act="sheet" data-arg="plandrinks">Choose drinks</button>'
          : '') + '<a class="btn" href="#/new/plan">Add a recipe</a>',
      );
    return plan.sel
      .map((r) => {
        const only = plan.onlyFor(r);
        const focus = plan.litB && plan.f.k === r.id;
        const lit = plan.litD && plan.litD.has(r.id);
        const dim = (plan.litD && !lit) || (plan.litB && !focus);
        const note = only.length
          ? `Needs ${r.bottles.length} bottle${r.bottles.length === 1 ? '' : 's'}; ${only.map(bname).join(' and ')} ${only.length === 1 ? 'is' : 'are'} only for this drink.`
          : `Needs ${r.bottles.length} bottle${r.bottles.length === 1 ? '' : 's'}, all shared with your other drinks.`;
        return `<div class="prow ${focus ? 'focus' : ''} ${lit ? 'lit' : ''} ${dim ? 'dim' : ''}"><button type="button" data-act="pfocus" data-arg="d|${esc(r.id)}" aria-pressed="${!!focus}"><span style="flex:1;min-width:0"><span class="pn">${esc(r.title)}</span><span class="pb">${r.bottles.map((k) => esc(bname(k))).join(' · ')}</span></span>${only.length ? `<span class="only"><span class="num">+${only.length}</span>${compact ? '' : 'only for this'}</span>` : ''}</button>
      ${focus ? `<div class="more"><p>${esc(note)}</p><a class="btn" href="#/r/${encodeURIComponent(r.id)}" style="padding:0 12px">Recipe</a><button class="btn" type="button" data-act="ptoggle" data-arg="${esc(r.id)}" style="padding:0 12px">Remove</button></div>` : ''}</div>`;
      })
      .join('');
  }
  function planBottleRows(plan) {
    const max = plan.keys.length ? plan.use[plan.keys[0]].length : 1;
    return plan.keys
      .map((k) => {

  /* ================= THE BAR TABLE (cleaned: each drink once) ================= */
  function barTable() {
    const bt = data.bar;
    if (!bt) return '<p class="meta">The bar table wasn’t found in bar-building/_overview.md.</p>';
    const seen = new Set();
    const norm = (s) =>
      s
        .toLowerCase()
        .replace(/\(.*?\)/g, '')
        .replace(/[^a-z]/g, '');
    const clean = bt.rows.map((row) => ({
      name: row.name,
      cells: row.cells.map((cell) =>
        cell.filter((it) => {
          const k = it.id || norm(it.n);
          if (seen.has(k)) return false;
          seen.add(k);
          return true;
        }),
      ),
    }));
    const item = (it) => {
      const pre = it.pre ? ` <em>+ ${esc(it.pre.replace(/:$/, '').toLowerCase())}</em>` : '';
      return it.id
        ? `<a href="#/r/${encodeURIComponent(it.id)}">${esc(it.n.replace(/\s*\(.*\)/, ''))}${pre}</a>`
        : `<span class="nr" title="No recipe in the book">${esc(it.n)}${pre}</span>`;
    };
    const owned = (row, ci) => {
      const bk = ROW_KEYS[row.name.toLowerCase()];
      const ck = bt.colKeys[ci];
      return bk && state.own[bk] && (ck === 'none' || state.own[ck]);
    };
    const rowName = (n) =>
      n
        .replace(/\s*\(.*\)/, '')
        .toLowerCase()
        .replace(/^dark rum$/, 'aged rum');
    const cols = bt.cols.map((c) => (/no other/i.test(c) ? 'On its own' : cap(c.toLowerCase())));
    if (wide())
      return `<div class="bartable-wrap"><table class="bt"><thead><tr><th><span class="vh">Base spirit</span></th>${cols.map((c) => `<th scope="col">${esc(c)}</th>`).join('')}</tr></thead>
    <tbody>${clean.map((row) => `<tr><th scope="row">${esc(rowName(row.name))}</th>${row.cells.map((c, ci) => `<td class="${c.length && owned(row, ci) ? 'own' : ''}">${c.map(item).join('')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    const ri = Math.min(state.barRow || 0, clean.length - 1);
    const row = clean[ri];
    return `<div class="bt-row-tabs">${clean.map((r, i) => `<button type="button" class="tag" aria-pressed="${i === ri}" data-act="barRow" data-arg="${i}">${esc(rowName(r.name))}</button>`).join('')}</div>
    <table class="bt bt-narrow" style="min-width:0"><tbody>${row.cells.map((c, ci) => (c.length ? `<tr><th scope="row" style="font:italic 400 15px/1.3 var(--cx-font-body);color:var(--cx-muted);white-space:normal;width:110px;position:static">${esc(cols[ci])}</th><td class="${owned(row, ci) ? 'own' : ''}">${c.map(item).join('')}</td></tr>` : '')).join('')}</tbody></table>`;
  }

  /* ================= MY RECIPES: add and edit ================= */
  function edStart(uid, from) {
    if (state.ed && state.ed.uid === (uid || null) && state.ed.from === (from || '')) return;
    const src = uid ? state.mine.find((m) => m.uid === uid) : null;
    if (uid && !src) {
      state.ed = null;
      return;
    }
    const draft = !uid ? store.get('draft', null) : null;
    const base = src ||
      draft || {
        title: '',
        chapter: 'other-spirits',
        base: '',
        glass: '',
        technique: '',
        bottles: [],
        intro: '',
        ingredients: '',
        method: '',
      };
    state.ed = Object.assign(cleanMine(base), {
      uid: uid || null,
      auto: !src && !(draft && draft.bottles && draft.bottles.length),
      err: '',
      del: false,
      from: from || '',
    });
    // opened from a spirit's page: that spirit, unless a draft already has one
    if (!uid && SPIRIT_CH.includes(from) && !(draft && (draft.title || draft.ingredients)))
      state.ed.chapter = from;
    state.ed.autoCh = !uid && !SPIRIT_CH.includes(from) && !(draft && draft.autoCh === false);
  }

  /* ================= router & render ================= */
  let lastRoute = '';
  // a path segment from the address; a malformed escape such as "%E0" gives ''

    }
  };
  const TAG_KEYS = ['era', 'character'];
  function route() {
    const h = location.hash.replace(/^#/, '') || '/';
    const p = h.split('/').filter(Boolean);
    if (p[0] === 'tag') {
      // only the tags a recipe page links to; anything else opens the library unfiltered
      const value = p[2] === undefined ? '' : decodeSegment(p[2]);
      state.filters = TAG_KEYS.includes(p[1]) && value ? { [p[1]]: [value] } : {};
      state.q = '';
      location.replace('#/lib');
      return null;
    }
    if (p[0] === 'lib') {
      if (p[1] && lookup(chaptersById, p[1])) {
        state.filters = { spirit: [p[1]] };
        location.replace('#/lib');
        return null;
      }
      return () => viewLibrary();
    }
    if (p[0] === 'recipes') return () => viewChapterRecipes(p[1]);
    if (p[0] === 'pick') return () => viewPick();
    if (p[0] === 'chapter') {
      location.replace(lookup(chaptersById, p[1]) ? chHref(p[1]) : '#/');
      return null;
    }
    if (p[0] === 'essay') return () => viewEssay(p[1]);
    if (p[0] === 'r') return () => viewRecipe(decodeSegment(p[1] || ''));
    if (p[0] === 'mix') return () => viewMix(decodeSegment(p[1] || ''));
    if (p[0] === 'bar') {
      if (p[1] === 'make') {
        state.barEdit = false;
        location.replace('#/bar');
        return null;
      }
      if (p[1] === 'table') {
        const e = chaptersById['bar-building'] && chaptersById['bar-building'].essay;
        const i = e ? e.blocks.filter((b) => b.t === 'h2').findIndex((b) => /bar table/i.test(b.text)) : -1;
        location.replace('#/essay/bar-building' + (i >= 0 ? '/s' + (i + 1) : ''));
        return null;
      }
      return () => viewBar();
    }
    if (p[0] === 'plan') return () => viewPlan();
    if (p[0] === 'mine') {
      state.filters = { collection: ['mine'] };
      state.q = '';
      location.replace('#/lib');
      return null;
    }
    if (p[0] === 'new') return () => viewEdit(null, p[1] || '');
    if (p[0] === 'edit') {
      // a malformed escape keeps the raw segment, which matches no recipe (as before)
      const uid = p[1] === undefined ? undefined : decodeSegment(p[1]) || p[1];

  function render(keepScroll) {

    if (keepScroll) window.scrollTo(0, y);

    if (fk) {
      const el = document.querySelector(fk);

        if (el.setSelectionRange && el.value) el.setSelectionRange(el.value.length, el.value.length);

          }
        }
        const msg = [];
        let res = null;
        if (j) {
          if (j.own) {
            const own = dict();
            j.own.forEach((k) => {
              if (Object.hasOwn(bottlesById, k)) own[k] = 1;
            });
            state.own = own;
            store.set('own', own);
            msg.push('My bar restored');
          }
          if (j.recipes) res = addEntries(entriesFromJson(j.recipes), { keepUids: j.kind === 'backup' });
        } else {
          const entries = parseMarkdown(t);
          if (!entries.length) {
            toast('No recipes found in that file. Each needs an Ingredients section.');
            return;
          }
          res = addEntries(entries);
        }
        if (res) saveMine();
        if (j && j.plan) {
          const pl = dict();
          j.plan.forEach((k) => {
            if (Object.hasOwn(recipesById, k)) pl[k] = 1;
          });
          state.plan = pl;
          store.set('plan', pl);
          msg.push('plan restored');
        }
        if (res) {
          const bits = [];
          if (res.added) bits.push(`${res.added} recipe${res.added === 1 ? '' : 's'}`);
          if (res.versions) bits.push(`${res.versions} version${res.versions === 1 ? '' : 's'}`);
          msg.push(bits.length ? bits.join(' and ') + ' added' : 'nothing new to add');
          if (res.same) msg.push(`${res.same} already here`);
        }
        state.sheet = null;
        if (j && j.kind === 'backup') render(true);
        else if (res && res.first && res.added + res.versions === 1) {
          const p = recipesById[res.first];
          if (p) state.varIx[p.id] = Math.max(0, blocksOf(p).length - 1) * (res.versions ? 1 : 0);
          location.hash = '#/r/' + res.first;
        } else if (res && res.added + res.versions) location.hash = '#/mine';
        else render(true);
        toast(cap(msg.join(' · ')) + '.');
      })
      .catch(() => toast('That file couldn’t be read.'));
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && state.sheet) {
      state.sheet = null;
      render(true);
    }
  });
  // essay contents: highlight the section being read
  window.addEventListener(
    'scroll',
    () => {
      const links = document.querySelectorAll('.toc [data-sec]');
      if (!links.length) return;
      let cur = 'top';
      document.querySelectorAll('.essay h2[id]').forEach((h) => {
        if (h.getBoundingClientRect().top < 140) cur = h.id;
      });
      links.forEach((l) => l.classList.toggle('cur', l.dataset.sec === cur));
    },
    { passive: true },
  );

  applyTheme();
  onRoute();

  /* ---------------- offline: only when served from a web address (not when opened as a file) ---------------- */
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    const offer = (reg) => {
      if (!reg.waiting || document.getElementById('update')) return;
      const b = document.createElement('div');
      b.id = 'update';
      b.setAttribute('role', 'status');
      b.innerHTML =
        '<span class="dia"></span><span class="t">A new edition of the book is ready</span><button class="btn btn-primary" type="button" style="min-height:40px">Update</button>';
      b.querySelector('button').onclick = () => reg.waiting && reg.waiting.postMessage('update');
      document.body.appendChild(b);
    };
    let reloading = false;
    const hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!reloading && hadController) {
        reloading = true;
        location.reload();
      }
    });
    navigator.serviceWorker
      .register('sw.js')
      .then((reg) => {
        offer(reg);
        reg.addEventListener('updatefound', () => {
          const w = reg.installing;
          if (w)
            w.addEventListener('statechange', () => {
              if (w.state === 'installed' && navigator.serviceWorker.controller) offer(reg);
            });
        });
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') reg.update().catch(() => {});
        });
      })
      .catch(() => {});
  }
})();

</script>
</body>
</html>
