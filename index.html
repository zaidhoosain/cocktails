ice cube tray. The goal is to lengthen the drink - which brings out more mint flavor - and chill it to a satisfyingly arctic temperature, without watering it down too much. I like to use hand-cracked ice, with maybe 1-2 normal-sized cubes in there. Bag ice is another good option - which is typically a mix of cubes, slush and snow."],"main":{"ings":[{"text":"2 oz White Rum","q1":2.0,"q2":null,"qual":"","rest":"White Rum","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"3/4 oz lime juice","q1":0.75,"q2":null,"qual":"","rest":"lime juice","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1 oz simple syrup","q1":1.0,"q2":null,"qual":"","rest":"simple syrup","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"10=-12 mint leaves","kind":"asis"},{"text":"Chilled soda water","kind":"asis"}],"method":[{"text":"In a shaker, muddle the mint leaves in the simple syrup. Add the rum, lime juice and fill with ice. Shake for 8-10 seconds and strain into a highball or collins glass over cracked ice (with one or two full sized cubes). top with 1-2 oz soda water. Briefly stir with a straw to mix. Garnish with the mint springs.","alt":false}]},"variations":[]},{"id":"caipirinha","title":"Caipirinha","subtitle":"","chapter":"rum","order":6,"glass":"rocks","technique":"built","base":"Cachaça","bottles":["cachaca"],"cell":"","era":[],"character":[],"photo":"","intro":["TheThe Caipirinha (KAI-per-EEN-yah) is the national cocktail of Brazil and a refreshing summer classic that’s as simple as they come. It has just three ingredients: lime, sugar and cachaça (a style of rum, more on that below). So basically it is a repurposed Daiquiri. The main difference - other than the cachaça - is muddled lime wedges instead of using fresh lime juice. This extracts the oils in the rind giving the drink a sharper, brighter lime flavor.","There are conflicting options on the best way to prepare a Caipirinha. There two main points of contention are whether to use raw sugar or simple syrup and whether it’s better to shake or stir. My approach has evolved over the years. But today, after much trial and error, I feel confident in saying this recipe makes the absolute best Caipirinha. You can take my word for it, or head over to the commentary section to see my justification for why. But of course, as always, feel free to ignore me and your own thing!"],"main":{"ings":[{"text":"2 oz cachaça","q1":2.0,"q2":null,"qual":"","rest":"cachaça","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"3/4 oz simple syrup","q1":0.75,"q2":null,"qual":"","rest":"simple syrup","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"Half a lime cut into quarters","kind":"asis"}],"method":[{"text":"In a sturdy rocks glass, muddle the limes in the simple syrup. Don’t worry about extracting every drop of juice, just be sure hit each piece at least once. Fill the glass with ice, preferably use cubes on the smaller side. You may even want to crack one or two of them. Add the cachaça and briskly stir until everything is well integrated.","alt":false}]},"variations":[]},{"id":"old-cuban","title":"The old cuban","subtitle":"","chapter":"rum","order":7,"glass":"flute","technique":"shaken","base":"Aged Rum","bottles":["dark-rum","champagne"],"cell":"dark-rum×champagne","era":[],"character":[],"photo":"","intro":["The Old Cuban, a delicious French 75 and Mojito hybrid from Audrey Saunders, is an example of several of these modifications at work at once. Note: this recipe is a bit smaller than her original, which calls for 1 ½ oz aged rum. The original recipe also calls for it to be served in a coupe/martini glass, which is fine, as is a flute."],"main":{"ings":[{"text":"1 1/4 oz aged rum","q1":1.25,"q2":null,"qual":"","rest":"aged rum","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1/2 oz lime juice","q1":0.5,"q2":null,"qual":"","rest":"lime juice","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"3/4 oz simple syrup","q1":0.75,"q2":null,"qual":"","rest":"simple syrup","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"6-8 mint leaves","q1":6.0,"q2":8.0,"qual":"","rest":"mint leaves","unit":"","unitPl":"","kind":"count"},{"text":"2 dashes Angostura bitters","q1":2.0,"q2":null,"qual":"","rest":"Angostura bitters","unit":"dash","unitPl":"dashes","kind":"count"},{"text":"2-3 oz chilled Brut Champagne","q1":2.0,"q2":3.0,"qual":"","rest":"chilled Brut Champagne","unit":"oz","unitPl":"oz","kind":"oz"}],"method":[{"text":"Muddle mint leaves in simple syrup.","alt":false},{"text":"Combine gin, lemon and simple syrup in a shaker, fill with ice. Shake for 6-8 seconds and strain into a champagne flute. Top with the Champagne or sparkling wine. Garnish with the expressed lemon peel.","alt":false}]},"variations":[]},{"id":"mai-tai","title":"The Mai Tai","subtitle":"","chapter":"rum","order":8,"glass":"rocks","technique":"shaken","base":"Aged Jamaican Rum","bottles":["dark-rum","orange-curacao"],"cell":"white-rum×orange-curacao","era":[],"character":[],"photo":"","intro":["The Mai Tai is probably the iconic tiki cocktail, despite the fact that in it's traditional form it contains no pineapple, passion fruit, guava or coconut or any of the usual tropical drink ingredients. The Mai Tai is basically a celebration of Rum.","Another key ingredient in the Mai Tai is Orgeat which is a syrup made from almonds which has a marzipan like flavour. Thanks to the revival in classic cocktails, several high quality versions can be bought at cocktail shops or online.","Which rum to use in a Mai Tai is a topic of much discussion and debate. The original recipe used a 17 year old Jamaican Rum that is now sadly no longer produced - and even if it were, few of us would be able to afford using a 17 year old rum into a mixed drink.","The general view now is to use a rum that echos's the spirit of the original. Thankfully the inventor of the drink shows us the way with a recipe from the 1972 (at which time the original rum was no longer available)","He suggested one ounce of dark Jamaican rum and one ounce of Martinique Rum. During the cocktail renaissance of the early 2000's bartenders who wanted to make a proper Mai Tai interpreted Martinique Rum as Rhum Agricole (French style rum made from cane sugar juice rather than molasses). This style of rum is drier and grassier with a more pungent aroma.","Martin Cate of the Smuggler's Cover (famous cocktail bar in San Francisco), however, did more research on the original recipe and found descriptions for Martinique rum as 'nutty and snappy', 'heavy in body' and 'similar to Jamaican rum' none of which sounds like Rhum Agricole. Cate suggests a french style molasses rum that has been heavily aged.","For good results use a rum like Smith and Cross pot still Jamaican rum blended with a Jamaican, Guyanese or Barbados Rum - like Eldorado 15"],"main":{"ings":[{"text":"1 1/2 oz aged Jamaican rum","q1":1.5,"q2":null,"qual":"","rest":"aged Jamaican rum","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1/2 oz Smith and Cross rum (if available otherwise sub with the Jamaican rum above)","q1":0.5,"q2":null,"qual":"","rest":"Smith and Cross rum (if available otherwise sub with the Jamaican rum above)","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"3/4 oz lime juice","q1":0.75,"q2":null,"qual":"","rest":"lime juice","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1/2 oz orange curaco","q1":0.5,"q2":null,"qual":"","rest":"orange curaco","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1/2 oz orange Orgeat","q1":0.5,"q2":null,"qual":"","rest":"orange Orgeat","unit":"oz","unitPl":"oz","kind":"oz"}],"method":[{"text":"Combine all ingredients into a shaker. Fill with ice and shake for 6-8 seconds. Strain into a rocks glass over crushed ice and garnish with a mint sprig.","alt":false}]},"variations":[]},{"id":"negroni","title":"Negroni","subtitle":"","chapter":"gin","order":1,"glass":"rocks","technique":"stirred","base":"Gin","bottles":["gin","sweet-vermouth","campari"],"cell":"gin×campari","era":[],"character":[],"photo":"","intro":["On paper, the Negroni looks like a bit of a mess. There's a whole ounce of each Campari and sweet vermouth, which adds up to more than the amount of base spirit, gin. But instead of a disjointed mess, somehow all those contrasting flavors come together in a perfect harmony, with each ingredient blending seamlessly into the next, it’s hard to know where one ends and the other begins. In that way, it is something of a cocktail miracle.","The Negroni's central element is of course bitterness - courtesy of Campari, the iconic red Italian liqueur - which to be sure, is not a flavor everyone enjoys. But if there's one place bitterness succeeds, it’s in cocktails, where it add an extra dimension flavor. So if the Negroni is a bit of a shock to your palate at first, I encourage you to give it a chance and take another sip. Acclimating yourself to the pleasures of bitterness in drinks will unlock a trove of cocktail possibilities.","The classic Negroni recipe calls for equal proportions of each ingredient. I, along with many bartenders, prefer to bump up the gin to dry it out and - let's be honest - to make it boozier. But that is up to you, it's good both ways."],"main":{"ings":[{"text":"1 oz Gin (Tanqueray)","q1":1.0,"q2":null,"qual":"","rest":"Gin (Tanqueray)","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1 oz Sweet Vermouth","q1":1.0,"q2":null,"qual":"","rest":"Sweet Vermouth","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1 oz Campari","q1":1.0,"q2":null,"qual":"","rest":"Campari","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"Orange Peel for garnish","kind":"asis"}],"method":[{"text":"Combine all ingredients in a chilled mixing glass. Fill with ice, stir for 18-25 seconds and strain into a chilled rocks glass over ice - preferably one large cube. Express the oils of the orange peel and add it into the glass.","alt":false},{"text":"Or you can prepare it right in the rocks glass you'll be drinking from. Just combine all the ingredients, add the ice, and stir.","alt":true}]},"variations":[]},{"id":"french-75","title":"French 75","subtitle":"","chapter":"gin","order":2,"glass":"flute","technique":"shaken","base":"Gin","bottles":["gin","champagne"],"cell":"gin×champagne","era":[],"character":[],"photo":"","intro":["When it comes to cocktails with Champagne/ or sparkling wine, the French 75 reigns supreme, (apologies to the Champagne Cocktail and Mimosa). It is basically a Tom Collins with champagne instead of soda water (yes please). The proportions of gin, lemon and sugar are less than they are in a Tom Collins, because we’re adding more booze in the form of Champagne, but the ratios are the same.","It’s a drink that accomplished many things at once, it’s crisp, refreshing, as well as strong and sophisticated. It also has a rich history (the name is comes from a piece of French Artillery), is perfect for groups and one of the easiest cocktails to modify to make new creations. It’s also the perfect brunch cocktail. Basically, this one is a must make. Just make sure the Champagne is cold!"],"main":{"ings":[{"text":"1 oz gin","q1":1.0,"q2":null,"qual":"","rest":"gin","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1/2 oz lemon juice","q1":0.5,"q2":null,"qual":"","rest":"lemon juice","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1/2 oz Simple Syrup","q1":0.5,"q2":null,"qual":"","rest":"Simple Syrup","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"2-3 oz chilled brut champagne","q1":2.0,"q2":3.0,"qual":"","rest":"chilled brut champagne","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"Lemon peel for garnish","kind":"asis"}],"method":[{"text":"Combine gin, lemon and simple syrup in a shaker, fill with ice. Shake for 6-8 seconds and strain into a champagne flute. Top with the Champagne or sparkling wine. Garnish with the expressed lemon peel.","alt":false}]},"variations":[]},{"id":"gimlet","title":"Gimlet","subtitle":"","chapter":"gin","order":3,"glass":"rocks","technique":"shaken","base":"Gin","bottles":["gin"],"cell":"gin×none","era":[],"character":[],"photo":"","intro":["The best way to make a Gimlet depends on your point of view. What’s indisputable is that it is a mixture of gin, lime, and sugar. From there it's a question of what you value more: authenticity or deliciousness.","The oldest Gimlet recipes call for Rose's Lime Juice, a preserved lime cordial made from lime concentrate and high fructose corn syrup. It tastes as gross as it sounds, which is why most contemporary bartenders make “fresh” Gimlets with fresh lime juice and simple syrup. Some purists object to this version as merely a gin sour, and maintain that unless Roses’s is used, it’s not a Gimlet at all. Then there's a third faction that attempts to bridge the gap by making lime cordial from scratch.","To my palette, fresh lime juice is best."],"main":{"ings":[{"text":"2 oz gin","q1":2.0,"q2":null,"qual":"","rest":"gin","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1/2 oz lime juice","q1":0.5,"q2":null,"qual":"","rest":"lime juice","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"3/4 oz simple syrup","q1":0.75,"q2":null,"qual":"","rest":"simple syrup","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"2 lime ‘eighths’","q1":2.0,"q2":null,"qual":"","rest":"lime ‘eighths’","unit":"","unitPl":"","kind":"count"}],"method":[{"text":"In a shaker, muddle the lime wedges in simple syrup. Add gin, lime juice, and fill with ice. Shake for 8-10 seconds and strain into a rocks glass over fresh ice. Or serve up if you prefer. Garnish with a lime wheel.","alt":false}]},"variations":[]},{"id":"clover-club","title":"Clover club","subtitle":"","chapter":"gin","order":4,"glass":"coupe","technique":"shaken","base":"Gin","bottles":["gin","dry-vermouth"],"cell":"gin×dry-vermouth","era":[],"character":[],"photo":"","intro":["While it may look like a wispy, fruit-flavored trifle, don’t underestimate it. The Clover Club is an elegant, tart, complex and altogether very sophisticated cocktail.","Contrary to some assumptions, this was not invented at the Clover Club, though it is one of the cornerstones of the menu. The original dates back to the turn of the 20th century","For those, who've never encountered egg white in a cocktail before, don't be thrown, it's just there for texture, and is essential to this drink's success."],"main":{"ings":[{"text":"1 1/2 oz Gin","q1":1.5,"q2":null,"qual":"","rest":"Gin","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1/2 oz dry vermouth","q1":0.5,"q2":null,"qual":"","rest":"dry vermouth","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1/2 oz lemon juice","q1":0.5,"q2":null,"qual":"","rest":"lemon juice","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1/2 oz raspberry syrup (or 3 raspberries plus 1/2 oz simple syrup)","q1":0.5,"q2":null,"qual":"","rest":"raspberry syrup (or 3 raspberries plus 1/2 oz simple syrup)","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1/2 oz egg white","q1":0.5,"q2":null,"qual":"","rest":"egg white","unit":"oz","unitPl":"oz","kind":"oz"}],"method":[{"text":"Combine all ingredients in a shaker, if using fresh raspberries muddle them first with the simple syrup. “Dry shake” without ice first for about 6 seconds. Then add ice and shake again very hard for 8-10 seconds. Strain into a chilled coupe glass, using a fine strainer if you muddled raspberries. Garnish with a raspberry.","alt":false},{"text":"You can skip the dry shake step if you have decent sized ice cubes - around 1 x 1 inches or from a common ice cube tray - and you shake like your life depends on it.","alt":false}]},"variations":[]},{"id":"tom-collins","title":"Tom Collins","subtitle":"","chapter":"gin","order":5,"glass":"","technique":"","base":"Gin","bottles":["gin"],"cell":"gin×none","era":[],"character":[],"photo":"","intro":["The Tom Collins is the grand daddy of all tall, fizzy cocktails. A classic that showcases how simplicity in cocktails can lead to greatness.","It's basically a gin sour or gimlet, with lemon juice instead of lime and served in a tall glass over ice topped with soda water. But a well made Tom Collins has a refreshing magic all it's own.","While simple in principle, a number of factors can conspire to create a sub par drink - temperature, level of carbonation, balance, level of dilution etc all need to be right.","Many recipes for this drink call for all the ingredients to be combined in the glass (including the soda water) and then rolled (poured back and forth from one glass to another).","The problem here is that it doesn't get the drink cold enough and kills too much of the carbonation. That's why the recipe below calls for the gin, lemon and syrup to be shaken separately but briefly. This chills the drink without too much dilution.","Pouring the soda water into the glass first rather than at the end helps with mixing the drink without stirring, keeping as much of the carbonation as possible."],"main":{"ings":[{"text":"2 oz gin","q1":2.0,"q2":null,"qual":"","rest":"gin","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"3/4 oz lemon juice","q1":0.75,"q2":null,"qual":"","rest":"lemon juice","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"3/4 oz simple syrup","q1":0.75,"q2":null,"qual":"","rest":"simple syrup","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"chilled soda water. ideally from a small unopened bottle/can","kind":"asis"}],"method":[{"text":"Combine","alt":false}]},"variations":[]},{"id":"martinez","title":"Martinez","subtitle":"","chapter":"gin","order":6,"glass":"coupe","technique":"stirred","base":"Old Tom Gin","bottles":["gin","sweet-vermouth","maraschino"],"cell":"gin×sweet-vermouth","era":[],"character":[],"photo":"","intro":["The Martinez is the precursor to the Martini, and a fantastic drink in its own right. Broadly speaking, it's a Martini with sweet vermouth (or a Manhattan with gin), though it was traditionally made with old tom gin, an older style of sweetened and, sometimes, barrel-aged gin. It was very popular at the end of the 19th century and, thankfully, much more available now that it was 5-10 years ago.","A barrel aged old tom, like Ransom, is my personal favourite in a Martinez, but even if you don’t that in stock, pretty much any gin, in any style, will make a great Martinez. The drink will, of course, come out differently, but that’s part of the fun (note: if you use a London dry style gin some may point out that the resulting drink is closer to a Hearst cocktail, but who’s keeping track?).","Regardless, if you are a lover of stirred, boozy drinks, the Martinez should absolutely be in your cocktail rotation. Despite its relation to the Martini, it stands on its own as one of the premier classic cocktails."],"main":{"ings":[{"text":"2 oz aged old tom gin","q1":2.0,"q2":null,"qual":"","rest":"aged old tom gin","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1 oz sweet vermouth","q1":1.0,"q2":null,"qual":"","rest":"sweet vermouth","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"Teaspoon Maraschino","kind":"asis"},{"text":"1 dash of Angostura bitters","q1":1.0,"q2":null,"qual":"","rest":"of Angostura bitters","unit":"dash","unitPl":"dashes","kind":"count"},{"text":"1 dash of Orange bitters","q1":1.0,"q2":null,"qual":"","rest":"of Orange bitters","unit":"dash","unitPl":"dashes","kind":"count"},{"text":"Lemon peel for garnish","kind":"asis"}],"method":[{"text":"Combine all ingredients in a chilled mixing glass. Fill with ice, stir for 18-25 seconds, then strain into a chilled coupe or martini glass. Garnish with an expressed lemon peel (an orange peel is nice too).","alt":false}]},"variations":[]},{"id":"martini","title":"Martini","subtitle":"","chapter":"gin","order":7,"glass":"martini","technique":"stirred","base":"Gin","bottles":["gin","dry-vermouth"],"cell":"gin×dry-vermouth","era":[],"character":[],"photo":"","intro":["The wonderful thing about the Martini is that there really is no established recipe, just a series of personalities. You can mix together gin with a healthy dose of dry vermouth and garnish it with a lemon twist and call it a martini. Or you could shake up vodka, olive brine and serve it with an olive and that would also be a martini.","So there is no right or wrong way to make a martini - here are a couple of variations - feel free to play around and find something that you like."],"main":{"ings":[{"text":"2 1/2 oz gin","q1":2.5,"q2":null,"qual":"","rest":"gin","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"3/4 - 1 oz dry vermouth","q1":0.75,"q2":1.0,"qual":"","rest":"dry vermouth","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1 dash of Orange bitters","q1":1.0,"q2":null,"qual":"","rest":"of Orange bitters","unit":"dash","unitPl":"dashes","kind":"count"},{"text":"Lemon peel for garnish","kind":"asis"}],"method":[{"text":"Combine all ingredients in a chilled mixing glass. Fill with ice, stir for 18-25 seconds, then strain into a chilled coupe or martini glass. Garnish with an expressed lemon peel.","alt":false},{"text":"For gin in the 40-45% ABV range use 3/4 oz dry vermouth, for 45-50% ABV use the full ounce.","alt":false},{"text":"For a Vodka martini replace the gin with vodka and reduce vermouth to 1/2 oz and forgo the orange bitters.","alt":false}]},"variations":[{"name":"Dry Martini","note":["A dry martini is a martini with slightly less dry vermouth. There’s no standard amount, but 1/4 - 1/2 oz is a good guide. Some prefer it ‘extra dry’ and don’t want any vermouth - that’s just pretty much straight up gin or vodka - which is not that great."],"ings":[{"text":"2 1/2 oz gin","q1":2.5,"q2":null,"qual":"","rest":"gin","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1/4 - 1/2 oz dry vermouth","q1":0.25,"q2":0.5,"qual":"","rest":"dry vermouth","unit":"oz","unitPl":"oz","kind":"oz"}],"method":[{"text":"Prepare as with the Martini","alt":false}]},{"name":"50/50 Martini","note":["Making a martini with equal parts vermouth and spirit may be unthinkable to a modern martini drinker, but it’s what the earliest martini recipes called for. Today these are called 50/50 martinis and are surprisingly good"],"ings":[{"text":"1 1/2 oz gin","q1":1.5,"q2":null,"qual":"","rest":"gin","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1 1/2 oz dry vermouth","q1":1.5,"q2":null,"qual":"","rest":"dry vermouth","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1 dash of orange bitters","q1":1.0,"q2":null,"qual":"","rest":"of orange bitters","unit":"dash","unitPl":"dashes","kind":"count"},{"text":"Lemon peel for garnish","kind":"asis"}],"method":[{"text":"Prepare as with the Martini","alt":false}]},{"name":"Dirty Martini","note":["The notorious dirty martini is just a martini with the addition of olive brine - which makes this quite a different type of martini.","How dirty or filthy you like your dirty martini is up to you so adapt the recipe below to your taste."],"ings":[{"text":"As with the martini adding olive brine:","kind":"asis"},{"text":"1/4 oz - slightly dirty","q1":0.25,"q2":null,"qual":"","rest":"- slightly dirty","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1/2 oz - classically dirty","q1":0.5,"q2":null,"qual":"","rest":"- classically dirty","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"3/4 oz - downright filthy","q1":0.75,"q2":null,"qual":"","rest":"- downright filthy","unit":"oz","unitPl":"oz","kind":"oz"}],"method":[{"text":"Prepare as with the Martini","alt":false}]},{"name":"Perfect Martini","note":["As with the perfect Manhattan, this martini is made with both dry and sweet vermouth."],"ings":[{"text":"2 1/2 oz gin","q1":2.5,"q2":null,"qual":"","rest":"gin","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1/2 oz dry vermouth","q1":0.5,"q2":null,"qual":"","rest":"dry vermouth","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1/2 oz sweet vermouth","q1":0.5,"q2":null,"qual":"","rest":"sweet vermouth","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1 dash of Orange bitters","q1":1.0,"q2":null,"qual":"","rest":"of Orange bitters","unit":"dash","unitPl":"dashes","kind":"count"},{"text":"Lemon peel for garnish","kind":"asis"}],"method":[{"text":"Prepare as with the Martini","alt":false}]}]},{"id":"margarita","title":"Margarita","subtitle":"","chapter":"tequila","order":1,"glass":"rocks","technique":"shaken","base":"Blanco Tequila","bottles":["tequila","cointreau"],"cell":"tequila×cointreau","era":[],"character":[],"photo":"","intro":["The Margarita is one, if not the, most popular tequila cocktails, and it might be one of the most butchered as well. (There is a huge difference between a nice bright, fresh margarita and cloying sweet, synthetic margarita made with premade mixer.","Making a great margarita doesn’t take much, just good quality ingredients. This means 100% agave tequila, fresh squeezed lime juice and a high quality orange liqueur.","The recipe below is the one I like best, but it’s a very personal thing - so experiment.","If you like your margarita a bit tarter - pull back on the simple syrup."],"main":{"ings":[{"text":"2 oz blanco tequila","q1":2.0,"q2":null,"qual":"","rest":"blanco tequila","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1 oz Cointreau","q1":1.0,"q2":null,"qual":"","rest":"Cointreau","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"3/4 oz fresh lime juice","q1":0.75,"q2":null,"qual":"","rest":"fresh lime juice","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"Scant 1/2 oz simple syrup","q1":0.5,"q2":null,"qual":"Scant","rest":"simple syrup","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"Salt for rim.","kind":"asis"}],"method":[{"text":"Combine all ingredients in a shaker, fill with ice. Shake for 8-10 seconds and strain into a rocks glass over fresh ice that has been rimmed with salt. (Or serve straight up in a chilled coupe glass if you prefer.","alt":false},{"text":"No garnish necessary, though a lime wheel or wedge is common.","alt":false}]},"variations":[{"name":"Slightly less boozy","note":["For a slightly less boozy version:"],"ings":[{"text":"1 1/2 oz blanco tequila","q1":1.5,"q2":null,"qual":"","rest":"blanco tequila","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"3/4 oz Cointreau","q1":0.75,"q2":null,"qual":"","rest":"Cointreau","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"Scant 3/4 oz fresh lime juice","q1":0.75,"q2":null,"qual":"Scant","rest":"fresh lime juice","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1/4 oz simple syrup","q1":0.25,"q2":null,"qual":"","rest":"simple syrup","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"Salt for rim.","kind":"asis"}],"method":[{"text":"Prepare as above","alt":false}]}]},{"id":"tommys-margarita","title":"Tommy’s Margarita","subtitle":"","chapter":"tequila","order":2,"glass":"rocks","technique":"shaken","base":"Blanco Tequila","bottles":["tequila"],"cell":"tequila×none","era":[],"character":[],"photo":"","intro":["A Tommy’s Margarita is basically a tequila Gimlet using agave syrup in place of sugar. It was created by Julio Bermejo of Tommy’s Mexican Restaurant in San Francisco in the early 90’s.","I tend to prefer this version to the original since leaving out the orange liqueur lets more of the flavour of the tequila come through. That is if you’re using a very good quality tequila.","That said, the original is a wonderful drink and the orange flavour pairs very well with the tequila.","When making this drink - use a light agave syrup - the darker ones have a more caramel flavour which can overpower the tequila."],"main":{"ings":[{"text":"2 oz blanco tequila","q1":2.0,"q2":null,"qual":"","rest":"blanco tequila","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"3/4 oz fresh lime juice","q1":0.75,"q2":null,"qual":"","rest":"fresh lime juice","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"heavy 1/2 oz light agave syrup","q1":0.5,"q2":null,"qual":"heavy","rest":"light agave syrup","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"Salt for rim.","kind":"asis"}],"method":[{"text":"Prepare as above, salt rim optional.","alt":false}]},"variations":[]},{"id":"flavoured-margaritas","title":"Flavoured Margaritas","subtitle":"","chapter":"tequila","order":3,"glass":"rocks","technique":"shaken","base":"Blanco Tequila","bottles":["tequila"],"cell":"","era":[],"character":[],"photo":"","intro":["Margaritas stand up well to some fruit flavours. You could just muddle in some fruit into the classic recipe above and have a pretty decent drink, but the Cointreau can sometimes compete with the fruit flavour."],"main":null,"variations":[{"name":"Strawberry Margarita","note":[],"ings":[{"text":"2 oz blanco tequila","q1":2.0,"q2":null,"qual":"","rest":"blanco tequila","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"3/4 oz lime juice","q1":0.75,"q2":null,"qual":"","rest":"lime juice","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"3/4 oz simple syrup (or 1oz if the strawberries are tart)","q1":0.75,"q2":null,"qual":"","rest":"simple syrup (or 1oz if the strawberries are tart)","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1-2 strawberries","q1":1.0,"q2":2.0,"qual":"","rest":"strawberries","unit":"","unitPl":"","kind":"count"}],"method":[{"text":"Muddle the strawberries in simple syrup. Add remaining ingredients in a shaker, fill with ice. Shake for 8-10 seconds and strain into rocks glass over fresh ice that has been rimemd with salt (optional) or serve straight up if you prefer.","alt":false},{"text":"Garnish with a halved strawberry.","alt":false}]},{"name":"Watermelon Margarita","note":[],"ings":[{"text":"2 oz blanco tequila","q1":2.0,"q2":null,"qual":"","rest":"blanco tequila","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"3/4 oz lime juice","q1":0.75,"q2":null,"qual":"","rest":"lime juice","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1 oz watermelon syrup","q1":1.0,"q2":null,"qual":"","rest":"watermelon syrup","unit":"oz","unitPl":"oz","kind":"oz"}],"method":[{"text":"Combine all the ingredients in a shaker, fill with ice. Shake for 8 seconds and strain into a salt rimmed glass.","alt":false},{"text":"To make the watermelon syrup, muddle about 2 cups worth of fresh watermelon until it’s a soupy pulp, then strain through a fine strainer to remove the solids. Mix 1 cup of watermelon juice with 1/2 cup of of sugar - this will make enough for 5-6 cocktails.","alt":false}]},{"name":"Jalapeño Margarita","note":[],"ings":[{"text":"2 oz Jalapeño infused tequila","q1":2.0,"q2":null,"qual":"","rest":"Jalapeño infused tequila","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1 oz Cointreau","q1":1.0,"q2":null,"qual":"","rest":"Cointreau","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"3/4 oz fresh lime juice","q1":0.75,"q2":null,"qual":"","rest":"fresh lime juice","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1/2 oz simple syrup","q1":0.5,"q2":null,"qual":"","rest":"simple syrup","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"Salt for rim.","kind":"asis"}],"method":[{"text":"Combine all the ingredients in a shaker, fill with ice. Shake for 8 seconds and strain into a salt rimmed glass.","alt":false},{"text":"To infuse the tequila, cut the heads off 4-5 jalapeños and slice lengthways. Combine with a 750 ml bottle of tequila (about 1 pepper to 4-5 oz of tequila) in a large container. Let it sit tasting periodically until the desired level of heat is achieved (typically 15-30 mins, but spicy peppers will work faster) Run the mixture through a fine strainer and funnel it back into the bottle. This can be stored at room temperature.","alt":false}]},{"name":"The Red \u0026 Black","note":[],"ings":[{"text":"2 oz blanco tequila","q1":2.0,"q2":null,"qual":"","rest":"blanco tequila","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1 oz lime juice","q1":1.0,"q2":null,"qual":"","rest":"lime juice","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1 oz black pepper syrup","q1":1.0,"q2":null,"qual":"","rest":"black pepper syrup","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1-3 strawberries.","q1":1.0,"q2":3.0,"qual":"","rest":"strawberries .","unit":"","unitPl":"","kind":"count"}],"method":[{"text":"Muddle the strawberries in a shaker until they are pulp. Add the remaining ingredients and fill the shaker 3/4 way with ice and shake for 6-8 seconds and strain into a rocks glass over fresh ice.","alt":false},{"text":"To make the syrup, mix 2 tablespoons of freshly ground black pepper, 1 cup of sugar and 1 cup of hot water. Combine all the igredients and let it sit for 24 hours. Strain through a fine mesh strainer.","alt":false}]}]},{"id":"paloma","title":"Paloma","subtitle":"","chapter":"tequila","order":4,"glass":"highball","technique":"built","base":"Blanco Tequila","bottles":["tequila"],"cell":"tequila×none","era":[],"character":[],"photo":"","intro":["The Paloma is Mexico’s answer to the Run and Coke. It’s actually more popular than the Margarita in Mexico. There are two approaches to making the drink. The classic way is with grapefruit soda or the ‘fresh’ way with fresh grapefruit juice, simple syrup and soda water. (Kind of a tequila Tom Collins)","Finding grapefruit soda can be a challenge. The most pervasive brand is Fresca, but it uses artificial sweetener that has a hollow metallic finish.","Good options if you can find them are Squirt, Ting and Jarritos Grapefruit."],"main":{"ings":[{"text":"2 oz blanco tequila","q1":2.0,"q2":null,"qual":"","rest":"blanco tequila","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"5 oz grapefruit soda","q1":5.0,"q2":null,"qual":"","rest":"grapefruit soda","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"2 lime wedges","q1":2.0,"q2":null,"qual":"","rest":"lime wedges","unit":"","unitPl":"","kind":"count"},{"text":"Pinch of salt","kind":"asis"}],"method":[{"text":"In a Collins glass, add the tequila, and fill with ice. Add a pinch of salt and squeeze the juice from the first lime wedge. Gently pour the grapefruit soda and briefly stir. Squeeze in the second lime wedge and a final sprinkling of salt (optional)","alt":false}]},"variations":[]},{"id":"tequila-old-fashioned","title":"Tequila Old Fashioned","subtitle":"","chapter":"tequila","order":5,"glass":"rocks","technique":"stirred","base":"Reposado or Añejo Tequila","bottles":["tequila"],"cell":"tequila×none","era":[],"character":[],"photo":"","intro":["Tequila is not just for Margaritas, a good high quality aged tequila makes for an excellent spirit forward cocktail. Well made aged tequila can exhibit much of the same complexity as any top shelf sipping spirit. Just in a different way.","The tequila old fashioned is a modern drink and uses barrel aged tequila as a base. It’s constructed in much the same way as a traditional old fashioned, with a few minor modifications.","For the sweetener, agave nectar is a natural choice. Using the darker agave nectar brings subtle notes of caramel and a rich silky texture.","For bitters Angostura butters will work great, but mole bitters will add a touch of spice that works well with the tequila."],"main":{"ings":[{"text":"2 oz reposado or añejo tequila","q1":2.0,"q2":null,"qual":"","rest":"reposado or añejo tequila","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"Teaspoon of agave nectar","kind":"asis"},{"text":"2 dashes Angostura bitters","q1":2.0,"q2":null,"qual":"","rest":"Angostura bitters","unit":"dash","unitPl":"dashes","kind":"count"},{"text":"1 dash mole bitters","q1":1.0,"q2":null,"qual":"","rest":"mole bitters","unit":"dash","unitPl":"dashes","kind":"count"},{"text":"Orange peel for garnish","kind":"asis"}],"method":[{"text":"In mixing glass, combine the tequila, agave and bitters. Fill with ice and stir for 20-25 seconds. Strain into a chilled rocks glass over ice (ideally one large cube)","alt":false},{"text":"Express the oils from the orange peel over the glass and use to garnish,","alt":false}]},"variations":[]},{"id":"sidecar","title":"Sidecar","subtitle":"Cognac \u0026 Cointreau","chapter":"other-spirits","order":1,"glass":"coupe","technique":"shaken","base":"Cognac","bottles":["cognac","cointreau"],"cell":"cognac×cointreau","era":[],"character":[],"photo":"","intro":["The sidecar is one of those drinks that has a well known name, but not many are familiar with the drink. A sidecar is basically a Margarita or White lady made with Cognac as a base.","The combination of the cognac and citrus makes for a drink that is bright, refreshing as well as strong and spirit forward.","Sidecars should be on the tart side with an edge. Too much sugar and this drink goes down perilously easily. Adding a sugar rim can make for a good compromise."],"main":{"ings":[{"text":"2 oz Cognac","q1":2.0,"q2":null,"qual":"","rest":"Cognac","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"3/4 oz Cointreau or Dry Curaçao","q1":0.75,"q2":null,"qual":"","rest":"Cointreau or Dry Curaçao","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"3/4 oz lemon juice","q1":0.75,"q2":null,"qual":"","rest":"lemon juice","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"Teaspoon of Demerara syrup or 1/4 oz simple syrup.","kind":"asis"}],"method":[{"text":"Combine all ingredients in a shaker, fill with ice. Shake for 8-10 seconds and strain into a chilled coupe or martini glass optionally rimmed with sugar. Garnish with an expressed orange peel.","alt":false}]},"variations":[]},{"id":"cosmopolitan","title":"The Cosmopolitan","subtitle":"","chapter":"other-spirits","order":2,"glass":"coupe","technique":"shaken","base":"Vodka","bottles":["vodka","cointreau"],"cell":"vodka×cointreau","era":[],"character":[],"photo":"","intro":["Easily one of the most famous cocktails invented in the last 50 years. A cosmo is pretty much a vodka Margarita with a splash of cranberry juice.","It’s often dismissed because of it’s association with a certain TV show or often (by men) because it’s pretty pink and is seen as a ‘lady’s drink’ This is nonsense. Well made a Cosmo is very tasty - string, fruity, citrusy, not overly sweet and very refreshing,","Ocean spray is the most commonly used cranberry juice for the cocktail and is the easiest to find. Unsweetened fancy cranberry juices can work well, but you will need to adjust for sweetness","As with many famous ‘modern classics’ there are a lot of bad versions floating out there so make your own and see why it became a classic."],"main":{"ings":[{"text":"2 oz vodka (or citrus vodka)","q1":2.0,"q2":null,"qual":"","rest":"vodka (or citrus vodka)","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"3/4 oz Cointreau","q1":0.75,"q2":null,"qual":"","rest":"Cointreau","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"3/4 oz lime juice","q1":0.75,"q2":null,"qual":"","rest":"lime juice","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"3/4 oz Ocean Spray","q1":0.75,"q2":null,"qual":"","rest":"Ocean Spray","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1/4 oz simple syrup","q1":0.25,"q2":null,"qual":"","rest":"simple syrup","unit":"oz","unitPl":"oz","kind":"oz"}],"method":[{"text":"Combine all ingredients in a shaker, fill with ice. Shake for 6-8 seconds and strain into a chilled coupe or martini glass optionally rimmed with sugar. Garnish with an expressed orange peel.","alt":false}]},"variations":[]},{"id":"espresso-martini","title":"Espresso Martini","subtitle":"","chapter":"other-spirits","order":3,"glass":"martini","technique":"shaken","base":"Vodka","bottles":["vodka","coffee-liqueur"],"cell":"vodka×coffee-liqueur","era":[],"character":[],"photo":"","intro":["The espresso martini is a bit of an oddity. A truly great modern classic - it’s a almost a desert drink, but it was invented on the London club scene in the early 80s as a pick me up.","Invented by the legendary bartender, Dick Bradsell at his bar in 1983. As legend has it, a young, future super model came up to Dick and asked for a drink that would wake her up and then f**k her up - and the espresso martini was born - though it was initially called a vodka espresso.","Even though the drink lays claim to the title of a Martini it is really nothing of the sort. On the face of it, it is easily lumped in with the many novelty ‘martinis’ that were born in the 80s - the Appletini, The key lime pie martini etc. The difference is - the espresso martini is genuinely delicious and has stood the test of time.","Dicks original version great but it is quite strong, and a slightly milder, and to my palette, a smoother and nicer version was developed by Jeff Morgenthaler. His version uses cold brew but I prefer it with espresso - though feel free to substitute cold brew for espresso in any of the versions below.","In terms of coffee liqueur - Kailua is most commonly used. However, I find it tends to be a bit sweet and lacks a good coffee punch.","There are plenty of alternatives though. Mr Black’s cold brew coffee liqueur is a great choice, but hard to find in Canada. Dr McGillicuddy’s coffee liquor is a decent option readily available in the LCBO, but feel free to experiment with others. Look for something with a good coffee flavour that isn’t too sweet."],"main":null,"variations":[{"name":"Dick Bradsell’s OG version","note":[],"ings":[{"text":"2 oz vodka","q1":2.0,"q2":null,"qual":"","rest":"vodka","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1/2 oz simple syrup","q1":0.5,"q2":null,"qual":"","rest":"simple syrup","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1/2 oz coffee liqueur","q1":0.5,"q2":null,"qual":"","rest":"coffee liqueur","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"Double shot of espresso","kind":"asis"}],"method":[{"text":"Combine in a shaker with ice, shake for 18-20 seconds and strain into a chilled martini glass or coupe.","alt":false},{"text":"Garnish with coffee beans (optional)","alt":false}]},{"name":"Jeff Morgenthaler’s Version","note":[],"ings":[{"text":"1 oz vodka","q1":1.0,"q2":null,"qual":"","rest":"vodka","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1 oz coffee liqueur","q1":1.0,"q2":null,"qual":"","rest":"coffee liqueur","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1 oz Cold brew","q1":1.0,"q2":null,"qual":"","rest":"Cold brew","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"Twist of lemon","kind":"asis"}],"method":[{"text":"Combine in a shaker with ice (including the lemon twist), shake for 18-20 seconds and strain into a chilled martini glass or coupe.","alt":false},{"text":"Garnish with coffee beans (optional)","alt":false}]},{"name":"Anders Erickson’s Version","note":[],"ings":[{"text":"1 oz vodka","q1":1.0,"q2":null,"qual":"","rest":"vodka","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1 oz coffee liqueur","q1":1.0,"q2":null,"qual":"","rest":"coffee liqueur","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1 oz espresso","q1":1.0,"q2":null,"qual":"","rest":"espresso","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"Scant 1/4 oz demerara syrup","q1":0.25,"q2":null,"qual":"Scant","rest":"demerara syrup","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"Twist of lemon","kind":"asis"}],"method":[{"text":"Combine in a shaker with ice (including the lemon twist), shake for 18-20 seconds and strain into a chilled martini glass or coupe.","alt":false},{"text":"Garnish with coffee beans (optional)","alt":false}]},{"name":"Cognac variation","note":[],"ings":[{"text":"1 oz Cognac","q1":1.0,"q2":null,"qual":"","rest":"Cognac","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1 oz coffee liqueur","q1":1.0,"q2":null,"qual":"","rest":"coffee liqueur","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"1 oz espresso","q1":1.0,"q2":null,"qual":"","rest":"espresso","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"Scant 1/4 oz demerara syrup","q1":0.25,"q2":null,"qual":"Scant","rest":"demerara syrup","unit":"oz","unitPl":"oz","kind":"oz"},{"text":"Twist of lemon","kind":"asis"}],"method":[{"text":"Combine in a shaker with ice (including the lemon twist), shake for 18-20 seconds and strain into a chilled martini glass or coupe.","alt":false},{"text":"Garnish with coffee beans (optional)","alt":false}]}]}],"bar":{"cols":["No other spirits","Sweet Vermouth","Dry Vermouth","Campari","Cointreau","Orange Curacao","Coffee Liqueur","Champagne","Absinthe"],"colKeys":["none","sweet-vermouth","dry-vermouth","campari","cointreau","orange-curacao","coffee-liqueur","champagne","absinthe"],"rows":[{"name":"Whiskey (Rye/Bourbon)","cells":[[{"pre":"","n":"Old Fashioned","id":"old-fashioned"},{"pre":"","n":"Whiske  Variant)","id":"espresso-martini"}],[],[]]},{"name":"Vodka","cells":[[{"pre":"","n":"Bloody Mary","id":""},{"pre":"","n":"Moscow Mule","id":""}],[],[{"pre":"","n":"Vodka Martini","id":""}],[],[{"pre":"","n":"Cosmopolitan","id":"cosmopolitan"}],[],[{"pre":"","n":"Espresso- Martini","id":"espresso-martini"},{"pre":"","n":"White Russian","id":""}],[],[]]}]},"bottles":[{"id":"whiskey","name":"Whiskey","group":"base"},{"id":"gin","name":"Gin","group":"base"},{"id":"white-rum","name":"White rum","group":"base"},{"id":"dark-rum","name":"Dark / aged rum","group":"base"},{"id":"tequila","name":"Tequila","group":"base"},{"id":"cognac","name":"Cognac","group":"base"},{"id":"vodka","name":"Vodka","group":"base"},{"id":"cachaca","name":"Cachaça","group":"base"},{"id":"sweet-vermouth","name":"Sweet vermouth","group":"modifier"},{"id":"dry-vermouth","name":"Dry vermouth","group":"modifier"},{"id":"campari","name":"Campari","group":"modifier"},{"id":"cointreau","name":"Cointreau","group":"modifier"},{"id":"orange-curacao","name":"Orange curaçao","group":"modifier"},{"id":"coffee-liqueur","name":"Coffee liqueur","group":"modifier"},{"id":"champagne","name":"Champagne","group":"modifier"},{"id":"absinthe","name":"Absinthe","group":"modifier"},{"id":"benedictine","name":"Bénédictine","group":"extra"},{"id":"maraschino","name":"Maraschino","group":"extra"},{"id":"amaro-nonino","name":"Amaro Nonino","group":"extra"},{"id":"aperol","name":"Aperol","group":"extra"},{"id":"green-chartreuse","name":"Green Chartreuse","group":"extra"},{"id":"creme-de-violette","name":"Crème de violette","group":"extra"},{"id":"lillet-blanc","name":"Lillet Blanc","group":"extra"}],"glasses":{"rocks":"Rocks","coupe":"Coupe","martini":"Martini","nick-and-nora":"Nick \u0026 Nora","highball":"Highball","flute":"Flute","julep":"Julep cup","mug":"Mug","wine":"Wine"},"techniques":{"stirred":"Stirred","shaken":"Shaken","built":"Built","blended":"Blended"},"grammar":{"number":"(?:\\d+\\s+\\d+/\\d+|\\d+/\\d+|\\d+(?:\\.\\d+)?|[¼½¾]|\\d+\\s*[¼½¾])","qualifiers":["scant","heavy","generous"],"rangeSeparators":["-","–","to"],"units":{"oz":["oz","oz"],"ounce":["oz","oz"],"ounces":["oz","oz"],"dash":["dash","dashes"],"dashes":["dash","dashes"],"drop":["drop","drops"],"drops":["drop","drops"],"teaspoon":["teaspoon","teaspoons"],"teaspoons":["teaspoon","teaspoons"],"tsp":["tsp","tsp"],"tablespoon":["tablespoon","tablespoons"],"tablespoons":["tablespoon","tablespoons"],"barspoon":["barspoon","barspoons"],"barspoons":["barspoon","barspoons"],"ml":["ml","ml"],"cup":["cup","cups"],"cups":["cup","cups"]}}}</script>
<script>
/* cocktails — the app. Everything is drawn from the JSON the build script embeds. */
(function () {
  'use strict';

  // lookup tables without a prototype, so a key like "constructor" or "__proto__" is never present unless put there
  const dict = (o) => Object.assign(Object.create(null), o);
  // a table entry for a key that came from a URL, a file or storage
  const lookup = (table, k) => (Object.hasOwn(table, k) ? table[k] : undefined);

  const data = JSON.parse(document.getElementById('cx-data').textContent);
  data.glasses = dict(data.glasses);
  data.techniques = dict(data.techniques);
  const recipesById = dict(Object.fromEntries(data.recipes.map((r) => [r.id, r])));
  const chaptersById = dict(Object.fromEntries(data.chapters.map((c) => [c.id, c])));
  const bottlesById = dict(Object.fromEntries(data.bottles.map((b) => [b.id, b])));
  const ROW_KEYS = dict({
    'whiskey (rye/bourbon)': 'whiskey',
    whiskey: 'whiskey',
    gin: 'gin',
    'white rum': 'white-rum',
    'dark (aged) rum': 'dark-rum',
    'dark rum': 'dark-rum',
    tequila: 'tequila',
    cognac: 'cognac',
    vodka: 'vodka',
  });

  /* ---------------- storage (per device; never required) ---------------- */
  const store = {
    get(k, d) {
      try {
        const v = localStorage.getItem('cx.' + k);
        return v == null ? d : JSON.parse(v);
      } catch (e) {
        return d;
      }
    },
    set(k, v) {
      try {
        localStorage.setItem('cx.' + k, JSON.stringify(v));
        return true;
      } catch (e) {
        return false; /* private mode or full */
      }
    },
    del(k) {
      try {
        localStorage.removeItem('cx.' + k);
      } catch (e) {
        /* ignore */
      }
    },
  };
  const state = {
    // saved on the device
    unit: store.get('unit', 'oz'), // 'oz' or 'ml'
    theme: store.get('theme', 'system'), // 'system', 'night' or 'day'
    scale: store.get('scale', 1), // text size, 0.85 to 1.4
    own: dict(store.get('own', {})), // My bar: bottle key → 1
    plan: dict(store.get('plan', {})), // Plan a bar: recipe id → 1
    mine: [], // recipes of your own; read from storage further down, where their uids are checked
    // this session only
    filters: {}, // library filters: facet key → chosen values
    q: '', // library search words
    facetOpen: { spirit: true, technique: true }, // filter groups shown open
    searchOpen: false, // the search box under the library header (narrow screens)
    focusSearch: false, // put the cursor in the library search on the next render
    drinks: {}, // recipe id → number of drinks
    ticks: {}, // recipe id → ingredient index → ticked
    varIx: {}, // recipe id → version showing
    introOpen: {}, // recipe id → introduction expanded (narrow screens)
    chTech: {}, // chapter id → technique shown on its recipes page
    barEdit: false, // My bar (narrow screens): choosing bottles
    barRow: 0, // the bar table (narrow screens): spirit row showing
    sheet: null, // open sheet: 'settings', 'filters', 'contents', 'export' or 'plandrinks'
    mix: null, // mixing mode: { id, v, cur, done, ticks, timer }
    awake: false, // the screen is being kept awake
    pfocus: null, // Plan a bar highlight: { t: 'd' (drink) or 'b' (bottle), k }
    ed: null, // the recipe being added or edited
  };

  /* ---------------- helpers ---------------- */
  const esc = (s) =>
    String(s == null ? '' : s).replace(
      /[&<>"']/g,
      (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
    );
  const words = (n) =>
    ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve'][
      n
    ] || String(n);
  const cap = (s) => (s ? s[0].toUpperCase() + s.slice(1) : s);
  // lower case, accents removed: "Vieux Carré" is found by "vieux carre"
  const fold = (s) =>
    String(s == null ? '' : s)
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase();
  const wide = () => matchMedia('(min-width: 900px)').matches;

  const icons = {
    share:
      '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5M5 12v7.5h14V12"/></svg>',
    search:
      '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M11 11 L15 15" stroke="currentColor" stroke-width="1.5"/></svg>',
    x: '<svg width="11" height="11" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2 L10 10 M10 2 L2 10" stroke="currentColor" stroke-width="1.6"/></svg>',
    back: '<svg width="9" height="14" viewBox="0 0 9 14" aria-hidden="true"><path d="M7 1 L1 7 L7 13" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>',
    minus:
      '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 7 H12" stroke="currentColor" stroke-width="1.6"/></svg>',
    plus: '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 7 H12 M7 2 V12" stroke="currentColor" stroke-width="1.6"/></svg>',
    plusSm:
      '<svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 1 V9 M1 5 H9" stroke="currentColor" stroke-width="1.5"/></svg>',
    tick: '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5 L5 9 L10 3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>',
    up: '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 8 L6 4 L10 8" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>',
    down: '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4 L6 8 L10 4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>',
    filter:
      '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4 H14 M4.5 8 H11.5 M7 12 H9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
    print:
      '<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M5 7 V2 H13 V7 M5 13 H3 V7 H15 V13 H13 M5 10 H13 V16 H5 Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>',
  };

  /* ---------------- glass icons (1.5 px at 48×64, like the cover lines) ---------------- */
  const GLASS = dict({
    rocks:
      '<path d="M9 26 L11 54 Q11.3 57 14.4 57 H33.6 Q36.7 57 37 54 L39 26"/><path d="M8 26 H40"/><path d="M11.6 51 H36.4"/><path d="M10.1 38 H37.9"/><path d="M16 31 L23 29 L25 36 L18 38 Z"/>',
    coupe:
      '<path d="M6 20 H42"/><path d="M6 20 C6 30 14 35 24 35 C34 35 42 30 42 20"/><path d="M9 24 H39"/><path d="M24 35 V54"/><path d="M14 57.5 Q24 52.5 34 57.5"/>',
    martini:
      '<path d="M5 13 H43"/><path d="M5 13 L24 36 L43 13"/><path d="M9.1 18 H38.9"/><path d="M24 36 V54"/><path d="M14 57.5 Q24 52.5 34 57.5"/><circle cx="30" cy="22" r="2.2"/>',
    'nick-and-nora':
      '<path d="M13 9 H35"/><path d="M13 9 C13 26 17 36 24 36 C31 36 35 26 35 9"/><path d="M13.3 15 H34.7"/><path d="M24 36 V54"/><path d="M15 57.5 Q24 53 33 57.5"/>',
    highball:
      '<path d="M13 8 L14.6 55 Q14.7 58 17.5 58 H30.5 Q33.3 58 33.4 55 L35 8"/><path d="M12 8 H36"/><path d="M14.5 52 H33.5"/><path d="M13.5 20 H34.5"/><path d="M29 3 L22 44"/>',
    flute:
      '<path d="M17 5 H31"/><path d="M17 5 C16 22 18.5 33 24 35 C29.5 33 32 22 31 5"/><path d="M16.9 12 H31.1"/><path d="M24 35 V54"/><path d="M15 57.5 Q24 53 33 57.5"/><circle cx="22" cy="24" r="0.9"/><circle cx="25.5" cy="19" r="0.9"/><circle cx="23.5" cy="29" r="0.9"/>',
    julep:
      '<path d="M11 19 L13 54 Q13.2 57 16.2 57 H31.8 Q34.8 57 35 54 L37 19"/><path d="M10 19 H38"/><path d="M11.3 24 H36.7"/><path d="M12.8 51 H35.2"/><path d="M21 19 C19 13 16 10 12 9"/><path d="M25 19 C25 12 27 8 31 6"/><path d="M23 13 C26 11.5 29 12.5 31 15"/>',
    wine: '<path d="M13 5 H35"/><path d="M13 5 C11 18 13 30 24 33 C35 30 37 18 35 5"/><path d="M12.2 15 H35.8"/><path d="M24 33 V54"/><path d="M14 57.5 Q24 52.5 34 57.5"/>',
    mug: '<path d="M9 20 V52 Q9 57 14 57 H29 Q34 57 34 52 V20"/><path d="M8 20 H35"/><path d="M34 27 H38 Q42 27 42 32 V40 Q42 45 38 45 H34"/><path d="M17 14 Q15 11 17 8 Q19 5 17 2"/><path d="M25 14 Q23 11 25 8 Q27 5 25 2"/>',
  });
  function glass(kind, h) {
    h = h || 64;
    const w = Math.round(h * 0.75);
    const sw = (1.5 * Math.pow(64 / h, 0.65)).toFixed(2);
    const body = GLASS[kind] || '<path d="M14 10 H34 L30 56 H18 Z" stroke-dasharray="3 3"/>';
    return `<svg width="${w}" height="${h}" viewBox="0 0 48 64" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;
  }

  /* ---------------- amounts ---------------- */
  function frac(v) {
    const q = Math.round(v * 4) / 4;

          part = /^ingredients$/i.test(s[1].trim()) ? 'ingredients' : 'method';

        buf.push(line);

      return [entryFrom(meta.title, meta, parseBody(body, '##'))];

    text.split(/\n(?=## (?!#))/).forEach((p) => {

    const res = { added: 0, versions: 0, same: 0, first: null };

    };

        glass: e.glass,
        technique: e.technique,
        base: e.base,

      let parent = (e.variantOf && lookup(recipesById, e.variantOf)) || findRecipe(e.title);
      const before = res.added + res.versions;
      e.blocks.forEach((b, i) => {
        const key = specKey(ingLines(b.ingredients), paragraphsOf(b.method));
        if (parent && blocksOf(parent).some((x) => blockKey(x) === key)) return;

      <a class="btn btn-primary" style="min-height:52px" href="#/bar">Show me</a></div></div>`;
  }

  /* ================= BROWSE ALL RECIPES ================= */
  const FACETS = [
    ['spirit', 'Spirit', (r) => [r.chapter], (v) => (chaptersById[v] || {}).name || v],
    [
      'collection',
      'Collection',
      (r) => [r.mine ? 'mine' : 'book'],
      (v) => (v === 'mine' ? 'My recipes' : 'The book'),
    ],
    ['technique', 'Technique', (r) => (r.technique ? [r.technique] : []), (v) => techName(v)],
    ['glass', 'Glass', (r) => (r.glass ? [r.glass] : []), (v) => glassName(v)],
    ['era', 'Era', (r) => r.era, (v) => cap(v.replace(/-/g, ' '))],
    ['character', 'Character', (r) => r.character, (v) => cap(v.replace(/-/g, ' '))],
  ];
  const chapterIndex = (v) => data.chapters.findIndex((c) => c.id === v);
  // the search words, split once for each new query
  const termsCache = { q: null, list: [] };
  const terms = () => {
    if (termsCache.q !== state.q) {
      termsCache.q = state.q;
      termsCache.list = fold(state.q).split(/\s+/).filter(Boolean);
    }
    return termsCache.list;
  };
  function matches(r, skip) {
    for (const [k, , get] of FACETS) {
      if (k === skip) continue;
      const sel = state.filters[k];
      if (sel && sel.length && !get(r).some((v) => sel.includes(v))) return false;
    }
    if (state.q.trim()) {
      if (!terms().every((t) => r.searchText.includes(t))) return false;
    }
    return true;
  }
  // why a search result matched: the ingredient line (or sentence) that contains the words
  function searchHint(r) {
    const ts = terms();
    if (!ts.length) return '';
    if (ts.every((t) => fold(r.title).includes(t))) return '';
    const mark = (s) => {
      let h = esc(s);
      ts.forEach((t) => {
        h = h.replace(
          new RegExp('(' + esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'),
          '<mark>$1</mark>',
        );
      });
      return h;
    };
    const ing = blocksOf(r)
      .flatMap((b) => b.ings)
      .find((i) => ts.some((t) => fold(i.text).includes(t)));
    if (ing) {
      const a = fmtAmount(ing, 1);
      return (
        (a ? `<span class="amount" style="font-size:.92em">${esc(a)}</span> ` : '') +
        mark(ing.kind === 'asis' ? ing.text : ing.rest)
      );
    }
    const sent = (r.intro.join(' ').match(/[^.!?]+[.!?]*/g) || [])
      .map((s) => s.trim())
      .find((s) => ts.some((t) => fold(s).includes(t)));
    return sent ? mark(sent) : '';
  }
  const activeFilters = () =>
    FACETS.flatMap(([k, , , nm]) => (state.filters[k] || []).map((v) => ({ k, v, label: nm(v) })));
  function filterPanel() {
    const pool = data.recipes;
    return FACETS.map(([k, label, get, nm]) => {
      if (k === 'collection' && !state.mine.length) return '';
      const vals = {};
      pool
        .filter((r) => matches(r, k))
        .forEach((r) =>
          get(r).forEach((v) => {
            vals[v] = (vals[v] || 0) + 1;
          }),
        );
      (state.filters[k] || []).forEach((v) => {
        vals[v] = vals[v] || 0;
      });
      const keys = Object.keys(vals).sort((a, b) =>
        k === 'spirit' ? chapterIndex(a) - chapterIndex(b) : nm(a).localeCompare(nm(b)),
      );
      if (!keys.length) return '';
      const open = state.facetOpen[k] || (state.filters[k] || []).length;
      return `<div class="facet"><button class="facet-h" type="button" data-act="facet" data-arg="${k}" aria-expanded="${!!open}">${label}${open ? icons.up : icons.down}</button>
      ${
        open
          ? keys
              .map((v) => {
                const on = (state.filters[k] || []).includes(v);
                return `<button class="check" type="button" style="width:100%;border:0;background:none;padding:0;text-align:left" data-act="toggleFilter" data-arg="${k}|${esc(v)}" aria-pressed="${on}"><span class="box">${icons.tick}</span>${esc(nm(v))}<span class="count">${vals[v]}</span></button>`;
              })
              .join('')
          : ''
      }</div>`;
    }).join('');
  }
  function libResults() {
    const pool = data.recipes;
    const res = pool.filter((r) => matches(r));
    const af = activeFilters();
    const q = state.q.trim();
    const chips = af
      .map(
        (f) =>
          `<span class="chip">${esc(f.label)}<button type="button" data-act="toggleFilter" data-arg="${f.k}|${esc(f.v)}" aria-label="Remove ${esc(f.label)}">${icons.x}</button></span>`,
      )
      .join('');
    const what = q ? ` with “${esc(q)}”` : '';
    const count =
      af.length || q
        ? `<span class="meta" style="font-size:16px"><span class="num" style="font-size:26px;font-style:normal">${res.length}</span> of ${pool.length}${what}</span>${chips}<button class="btn btn-quiet" type="button" data-act="clearFilters" style="text-transform:none;letter-spacing:0;font:400 16px/1 var(--cx-font-body);text-decoration:underline;text-underline-offset:4px">Clear all</button>`
        : `<span class="meta" style="font-size:16px">${pool.length} recipes</span>`;
    let body;
    if (!res.length && (state.filters.collection || []).join() === 'mine' && !state.mine.length && !q) {
      body = emptyBox(
        'No recipes of your own yet',
        'Add one, or import a file someone shared with you.',
        '<a class="btn btn-primary" href="#/new">Add a recipe</a>',
      );
    } else if (!res.length) {
      const last = af[af.length - 1];
      body = emptyBox(
        'Nothing matches',
        q
          ? `No recipe mentions “${esc(state.q)}” with these filters.`
          : 'These filters together leave no recipes.',
        (last
          ? `<button class="btn" type="button" data-act="toggleFilter" data-arg="${last.k}|${esc(last.v)}">Remove ${esc(last.label)}</button>`
          : '') + (q ? '<button class="btn" type="button" data-act="clearSearch">Clear search</button>' : ''),
      );
    } else body = `<div class="grid">${res.map((r) => card(r, q ? searchHint(r) : '')).join('')}</div>`;
    return `<div class="chips">${count}</div><div class="hair"></div>${body}`;
  }
  function viewLibrary() {
    const sp = state.filters.spirit || [];
    const c = sp.length === 1 ? chaptersById[sp[0]] : null;
    const essayEntry =
      c && c.essay
        ? `<a class="essay-entry stepped" href="#/essay/${encodeURIComponent(c.id)}"><span class="niche" style="width:40px;height:54px">${glass(SPIRIT_GLASS[c.id], 34)}</span><span style="display:flex;flex-direction:column;gap:4px;flex:1;position:relative"><span class="eyebrow">${esc(c.label)}</span><span class="display" style="font-size:26px">${esc(aboutName(c))}</span><span class="meta">${c.essay.blocks
            .filter((b) => b.t === 'h2')
            .map((b) => esc(b.text))
            .join(' · ')}</span></span><span class="btn" style="position:relative">Read</span></a>`
        : '';
    const nf = activeFilters().length;
    const w = wide();
    const af = state.focusSearch;
    state.focusSearch = false;
    const mineOnly = (state.filters.collection || []).length === 1 && state.filters.collection[0] === 'mine';
    return `<div class="screen has-tabbar">
    <header class="lib-head">
      <a href="#/" class="display wordmark" aria-label="cocktails — Home">cocktails</a>
      <div class="lib-tools">
        <label class="search"><span class="vh">Search recipes</span>${icons.search}<input type="search" placeholder="Search recipes and ingredients" value="${esc(state.q)}" data-input="q" autocomplete="off" ${af && w ? 'data-autofocus' : ''}></label>
        <a class="btn wide-only" href="#/bar">My bar</a>
        <button class="iconbtn narrow-only" type="button" data-act="toggleSearch" aria-label="Search" aria-expanded="${state.searchOpen}">${icons.search}</button>
        ${settingsButton()}
      </div></header>
    ${state.searchOpen ? `<div class="narrow-only" style="padding:0 14px 10px"><label class="search"><span class="vh">Search recipes</span>${icons.search}<input type="search" placeholder="Search recipes and ingredients" value="${esc(state.q)}" data-input="q" ${!w ? 'data-autofocus' : ''} autocomplete="off"></label></div>` : ''}
    ${rule2('margin:0 28px')}
    <div class="lib-body wrap">
      <aside class="filters side" aria-label="Filters"><div style="display:flex;align-items:center;justify-content:space-between;min-height:30px">${nf ? '<button class="btn btn-quiet" type="button" data-act="clearFilters" style="padding:0">Clear all</button>' : ''}</div>${filterPanel()}</aside>
      <main class="results">
        <div class="lib-title">${backBtn('#/', 'wide-only')}<h1 class="display">${mineOnly ? 'My recipes' : 'All recipes'}</h1><span style="flex:1"></span>${mineOnly ? '' : '<button class="btn wide-only" type="button" data-act="sheet" data-arg="export">Export</button>'}<a class="btn" href="#/new">${icons.plusSm}Add a recipe</a><button class="btn narrow-only" type="button" data-act="sheet" data-arg="filters">${icons.filter}Filters${nf ? ' · ' + nf : ''}</button></div>
        ${mineOnly ? `<div class="mine-bar"><p class="meta" style="flex:1">${state.mine.length ? `${state.mine.length} recipe${state.mine.length === 1 ? '' : 's'} of your own, saved on this device.` : 'Recipes you add are saved on this device. Import a .md file someone shared to add theirs.'}</p><button class="btn" type="button" data-act="sheet" data-arg="export">Export</button><label class="btn" style="cursor:pointer">Import<input type="file" accept=".md,.markdown,.txt,.json,text/markdown,text/plain,application/json" data-change="importFile" class="vh"></label></div>` : ''}
        ${essayEntry}
        <div id="results" style="display:flex;flex-direction:column;gap:14px">${libResults()}</div>
      </main>
    </div>${tabbar('lib')}</div>`;
  }

  // a spirit opens straight onto its recipes; Bar building onto the guide
  const chHref = (ch) =>
    ch === 'bar-building'
      ? '#/essay/bar-building'
      : data.recipes.some((r) => r.chapter === ch)
        ? '#/recipes/' + encodeURIComponent(ch)
        : '#/essay/' + encodeURIComponent(ch);

  /* ================= CHAPTER PAGE: banner + Recipes / About ================= */
  function chapterTabs(ch, cur) {
    const c = chaptersById[ch];
    const n = countIn(ch);
    if (!c.essay || !n) return '<span></span>';
    return `<nav class="ch-tabs" aria-label="${esc(c.name)}"><a href="#/recipes/${encodeURIComponent(ch)}" aria-selected="${cur === 'recipes'}" ${cur === 'recipes' ? 'aria-current="page"' : ''}>Recipes · ${n}</a><a href="#/essay/${encodeURIComponent(ch)}" aria-selected="${cur === 'overview'}" ${cur === 'overview' ? 'aria-current="page"' : ''}>${esc(aboutName(c))}</a></nav>`;
  }
  function chBanner(ch, cur) {
    const c = chaptersById[ch];
    const acts =
      ch === 'bar-building'
        ? `<div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn btn-primary" href="#/plan">Plan a bar</a><a class="btn" href="#/pick" style="background:var(--cx-bg)">What I have</a></div>`
        : chapterTabs(ch, cur);
    return `<header class="ch-banner cx-opener">${chArt(ch)}
    <div class="ch-banner-top">${backBtn('#/')}<span style="flex:1"></span>${settingsButton()}</div>
    <div class="ch-banner-row">${acts}<div class="ch-banner-words"><p class="eyebrow">${esc(c.label)}</p><h1 class="display">${esc(c.display)}</h1></div></div></header>${rule2('opacity:1')}`;
  }
  function viewEssay(ch) {
    const c = lookup(chaptersById, ch);
    if (!c || !c.essay) return c ? viewChapterRecipes(ch) : viewHome();
    const e = c.essay;
    let sec = 0,
      firstP = true,
      lede = false;
    const used = new Set();
    const tblIdx = e.blocks.filter((b) => b.t === 'h2').findIndex((b) => /bar table/i.test(b.text));
    const body = e.blocks
      .map((b) => {
        if (b.t === 'h2') {
          sec++;
          lede = true;
          const h = `<h2 class="subhead" id="s${sec}">${esc(b.text)}</h2>`;
          return ch === 'bar-building' && sec === tblIdx + 1
            ? h +
                `<p class="meta" style="margin:-4px 0 12px;font-size:16px">Spirits down the side, what you mix them with along the top. Linked names have a recipe; framed cells are ones your bar can make.</p><div class="inline-table">${barTable()}</div>`
            : h;
        }
        if (b.t === 'h3') return `<h3 class="minorhead">${esc(b.text)}</h3>`;
        if (b.t === 'quote')
          return `<blockquote class="pull">${rule2()}<p>${esc(b.text)}</p>${dia()}</blockquote>`;
        let html;
        if (lede) {
          const m = b.text.match(/^.*?[.!?](?=\s|$)/);
          const first = m ? m[0] : b.text;
          html = `<span class="lede">${linkify(first, used)}</span>${linkify(b.text.slice(first.length), used)}`;
          lede = false;
        } else html = linkify(b.text, used);
        const p = `<p class="${firstP ? 'dropcap' : ''}">${html}</p>`;
        firstP = false;
        return p;
      })
      .join('');
    const toc = [{ n: 'Introduction', id: 'top' }].concat(
      e.blocks.filter((b) => b.t === 'h2').map((b, i) => ({ n: b.text, id: 's' + (i + 1) })),
    );
    const n = countIn(ch);
    const tail =
      ch === 'bar-building'
        ? `${divider()}<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><a class="btn btn-primary" href="#/plan">Plan a bar</a><a class="btn" href="#/pick">What I have</a></div>`
        : `${divider()}<div style="display:flex;justify-content:center"><a class="btn btn-primary" href="#/recipes/${encodeURIComponent(ch)}">The recipes · ${n}</a></div>`;
    const extra =
      ch === 'bar-building'
        ? `<div class="side-sec"><a class="tlink" href="#/plan">Plan a bar</a><a class="tlink" href="#/pick">What I have</a><a class="tlink" href="#/bar">My bar</a></div>`
        : n
          ? `<div class="side-sec"><a class="tlink" href="#/recipes/${encodeURIComponent(ch)}">The ${n} ${esc(c.name.toLowerCase())} recipes</a></div>`
          : '';
    return `<div class="screen chpage has-tabbar">${chBanner(ch, 'overview')}<div class="essay">
    <aside class="toc side"><p class="eyebrow" style="margin-bottom:8px">Contents</p><nav aria-label="Contents">${toc.map((t, i) => `<a href="#" data-act="jump" data-arg="${t.id}" class="${i === 0 ? 'cur' : ''}" data-sec="${t.id}"><span class="mark"></span>${esc(t.n)}</a>`).join('')}</nav>${extra}</aside>
    <article id="top"><div>
        <div class="narrow-only" style="display:flex;justify-content:flex-end;margin-bottom:8px"><button class="btn" type="button" data-act="sheet" data-arg="contents" style="padding:0 14px">Contents</button></div>
        <h2 class="etitle">${esc(e.title.replace(/ - /, ' – '))}</h2>
        <div class="divider" style="justify-content:flex-start" aria-hidden="true"><span class="h"></span>${dia(true)}<span class="h"></span></div>
        <div class="prose">${body}</div>${tail}</div></article></div>${tabbar('home')}</div>`;
  }
  function viewChapterRecipes(ch) {
    const c = lookup(chaptersById, ch);
    if (!c) return viewHome();
    const all = data.recipes.filter((r) => r.chapter === ch);
    if (!all.length) return viewEssay(ch);
    const techs = Object.keys(data.techniques).filter((t) => all.some((r) => r.technique === t));
    const f = (state.chTech || {})[ch] || 'all';
    const list = f === 'all' ? all : all.filter((r) => r.technique === f);
    const opts = [['all', 'All', all.length]].concat(
      techs.map((t) => [t, techName(t), all.filter((r) => r.technique === t).length]),
    );
    const side = `<div class="show-list">${opts.map(([k, l, n]) => `<button type="button" data-act="chTech" data-arg="${esc(ch)}|${esc(k)}" aria-pressed="${f === k}">${dia(f !== k)}${esc(l)}<span class="count">${n}</span></button>`).join('')}</div>`;
    const chipsN = `<div class="chips">${opts.map(([k, l, n]) => `<button type="button" class="tag" data-act="chTech" data-arg="${esc(ch)}|${esc(k)}" aria-pressed="${f === k}">${dia(f !== k, 'width:6px;height:6px')}${esc(l)} ${n}</button>`).join('')}</div>`;
    return `<div class="screen chpage has-tabbar">${chBanner(ch, 'recipes')}<div class="essay">
    <aside class="toc side">${techs.length > 1 ? `<p class="eyebrow" style="margin-bottom:8px">Show</p>${side}` : ''}
      <div class="side-sec">${c.essay ? `<a class="tlink" href="#/essay/${encodeURIComponent(ch)}">${esc(aboutName(c))}</a>` : ''}<a class="tlink" href="#/lib">Browse all recipes</a><a class="tlink" href="#/plan">Plan a bar</a>${addLink('#/new/' + encodeURIComponent(ch), 'Add a ' + c.name.toLowerCase().replace(/^other spirits$/, 'recipe') + (ch === 'other-spirits' ? '' : ' recipe'))}</div></aside>
    <article><div style="max-width:960px">
        ${techs.length > 1 ? `<div class="narrow-only" style="margin-bottom:12px">${chipsN}</div>` : ''}
        <div class="grid">${list.map((r) => card(r)).join('')}${addCard('#/new/' + encodeURIComponent(ch), ch === 'other-spirits' ? 'Add a recipe of your own' : 'Add your own ' + c.name.toLowerCase() + ' recipe')}</div></div></article></div>${tabbar('home')}</div>`;
  }

  /* ================= RECIPE ================= */
  function ingList(r, b, tickable) {
    const n = drinks(r.id);
    const tk = state.ticks[r.id] || {};
    return b.ings
      .map((ing, k) => {
        const amt = fmtAmount(ing, n);
        const asis = ing.kind === 'asis';
        const cls = asis ? 'asis-row' : k === 0 ? 'base' : '';
        const inner = `${tickable ? `<span class="box">${icons.tick}</span>` : ''}<span class="amount">${esc(amt)}</span><span class="nm">${ingRest(ing, n)}${asis && !/garnish|rim/i.test(ing.text) ? '<span class="asis" title="As written — not scaled"></span>' : ''}</span>`;
        return tickable
          ? `<button type="button" class="ing ${cls}" data-act="tick" data-arg="${esc(r.id)}|${k}" aria-pressed="${!!tk[k]}">${inner}</button>`
          : `<div class="ing ${cls}">${inner}</div>`;
      })
      .join('');
  }
  function drinksBar(r) {
    const n = drinks(r.id);
    return `<div class="drinksbar"><div class="stepper"><button type="button" data-act="drinks" data-arg="${esc(r.id)}|-1" aria-label="Fewer drinks" ${n <= 1 ? 'disabled' : ''}>${icons.minus}</button><output aria-live="polite">${n} drink${n > 1 ? 's' : ''}</output><button type="button" data-act="drinks" data-arg="${esc(r.id)}|1" aria-label="More drinks" ${n >= 12 ? 'disabled' : ''}>${icons.plus}</button></div>
    <div class="seg" role="group" aria-label="Units"><button type="button" data-act="unit" data-arg="oz" aria-pressed="${state.unit === 'oz'}">oz</button><button type="button" data-act="unit" data-arg="ml" aria-pressed="${state.unit === 'ml'}">ml</button></div></div>`;
  }
  function scaledNotes(r) {
    const n = drinks(r.id);
    let out = '';
    if (n > 1)
      out += `<p class="scaled">Scaled for ${n} drinks · garnishes as written <button class="btn btn-quiet" type="button" data-act="drinks" data-arg="${esc(r.id)}|reset" style="min-height:32px">Reset</button></p>`;
    if (n > 4)
      out += `<p class="note">${r.technique === 'stirred' ? 'Over 4 drinks: stir in batches so each gets proper dilution.' : r.technique === 'shaken' ? 'Over 4 drinks: split between two shakers.' : 'Over 4 drinks: mix in batches.'}</p>`;
    return out;
  }
  function varList(r) {
    const bl = blocksOf(r);
    if (bl.length < 2) return '';
    const cur = Math.min(state.varIx[r.id] || 0, bl.length - 1);
    return `<p class="eyebrow" style="margin-top:4px">Versions</p><div class="vlist" role="tablist" aria-label="Versions">${bl.map((b, i) => `<button type="button" role="tab" aria-selected="${i === cur}" data-act="variant" data-arg="${esc(r.id)}|${i}">${dia(i !== cur)}${esc(b.name)}${b.mine ? '<span class="mine-tag">Mine</span>' : ''}</button>`).join('')}</div>`;
  }
  function varTabs(r) {
    const bl = blocksOf(r);
    if (bl.length < 2) return '';
    const cur = Math.min(state.varIx[r.id] || 0, bl.length - 1);
    return `<div class="tabs-scroll" style="margin:6px 0 14px"><div class="seg" role="tablist" aria-label="Versions">${bl.map((b, i) => `<button type="button" role="tab" aria-selected="${i === cur}" data-act="variant" data-arg="${esc(r.id)}|${i}" style="min-height:44px">${esc(b.name)}${b.mine ? ' · mine' : ''}</button>`).join('')}</div></div>`;
  }
  function methodSteps(r, b) {
    let n = 0;
    const d = drinks(r.id);
    return `<ol style="list-style:none;margin:0;padding:0">${b.method.map((s) => (s.alt ? `<li class="step alt"><span class="stepnum">or</span><p>${inlineAmounts(s.text, d, true)}</p></li>` : `<li class="step"><span class="stepnum">${++n}</span><p>${inlineAmounts(s.text, d, true)}</p></li>`)).join('')}</ol>`;
  }
  const secH = (t) => `<div class="sec-h"><p class="eyebrow">${t}</p><span class="hair"></span></div>`;
  function recipeHeader(r) {
    const tags = r.era.map((v) => ['era', v]).concat(r.character.map((v) => ['character', v]));
    if (r.mine)
      return `<p class="eyebrow">My recipe · ${esc(chaptersById[r.chapter].name)}</p><h1 class="recipe-title">${esc(r.title)}</h1><p class="meta" style="font-size:17px">${metaLine(r)}</p>${mineActs(r)}`;
    return `<p class="eyebrow">${esc(chaptersById[r.chapter] ? chaptersById[r.chapter].label + ' · ' + chaptersById[r.chapter].name : '')}${r.variations.length ? ' · ' + words(blocksOf(r).length) + ' versions' : ''}</p>
    <h1 class="recipe-title">${esc(r.title)}</h1>
    ${r.subtitle ? `<p style="margin:0 0 8px;font-style:italic;font-size:20px">${esc(r.subtitle)}</p>` : ''}
    <p class="meta" style="font-size:17px">${metaLine(r)}</p>
    ${aboutLink(r)}
    ${tags.length ? `<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">${tags.map(([k, v]) => `<a class="tag" href="#/tag/${k}/${encodeURIComponent(v)}">${esc(v.replace(/-/g, ' '))}</a>`).join('')}</div>` : ''}`;

  function relatedLinks(r) {
